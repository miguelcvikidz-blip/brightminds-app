<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BrightMinds Academy</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BrightMinds">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400..700&family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800;900&display=swap">
<style>:root{color-scheme:light}body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head><body>
<style>
/* Layout: framed product shell — ink sidebar + warm workspace. Student views are playful (game map, battles),
   staff views are dense and data-first. One committed light look, same brand as the investor deck. */
:root{
  color-scheme: light;
  --ink:#15161D; --ink2:#1F2029; --ink3:#2A2C36; --ink-line:rgba(247,242,233,.12);
  --paper:#F1EBDF; --work:#F8F4EC; --card:#FFFDF8; --card2:#FBF6EC; --line:#E6DCCB; --line2:#EFE7D8;
  --text:#15161D; --text2:#4A4D57; --muted:#6B6E78; --on-ink:#F7F2E9; --on-ink2:#BDB6A8;
  --amber:#E9A23B; --amber-ink:#9A5300; --amber-soft:#FCEBD0;
  --teal:#0F6E64; --teal2:#1B9C8E; --teal-soft:#DDF0EC;
  --mate:#3D6BD4; --lect:#E2672E; --ing:#16A37A;
  --crit:#C8382B; --serious:#D9701E; --warn:#B98200; --ok:#2E8B57; --meta:#6A4FC8;
  --f-display:'Bricolage Grotesque','Trebuchet MS',sans-serif;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'DM Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --r-xl:28px; --r-lg:20px; --r-md:14px; --r-sm:10px;
  --shadow:0 1px 0 rgba(21,22,29,.04),0 12px 32px -18px rgba(21,22,29,.25);
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--text);font:400 15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 32px}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
.num{font-variant-numeric:tabular-nums}

/* ---------- top demo bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:rgba(241,235,223,.92);backdrop-filter:blur(10px);padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:38px;height:38px;border-radius:11px;background:var(--amber);display:grid;place-items:center;font:800 17px var(--f-display);color:var(--ink);letter-spacing:-.04em;flex:none}
.brand b{font:700 18px var(--f-display);letter-spacing:-.02em}
.roles{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-left:auto;overflow-x:auto;max-width:100%}
.roles button{display:flex;align-items:center;gap:7px;border:0;background:transparent;padding:8px 12px;border-radius:10px;font-weight:600;font-size:14px;color:var(--text2);white-space:nowrap;transition:background .2s,color .2s}
.roles button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.roles button:not([aria-pressed="true"]):hover{background:var(--card2);color:var(--text)}
.demo-chip{font:500 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--amber-ink);background:var(--amber-soft);padding:6px 10px;border-radius:999px;white-space:nowrap}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);background:var(--work);border:1px solid var(--line);border-radius:var(--r-xl);overflow:clip;min-height:calc(100vh - 110px);box-shadow:var(--shadow)}
.side{background:var(--ink);color:var(--on-ink);padding:22px 14px;display:flex;flex-direction:column;gap:22px;min-width:0}
.who{display:flex;align-items:center;gap:12px;padding:6px 8px}
.who .av{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;overflow:hidden;background:var(--ink3)}
.who b{display:block;font:700 15px var(--f-display)}
.who span{font-size:13px;color:var(--on-ink2)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:var(--on-ink2);padding:11px 12px;border-radius:12px;font-weight:600;font-size:14.5px;text-align:left;transition:background .2s,color .2s;white-space:nowrap}
.nav button:hover{background:rgba(247,242,233,.06);color:var(--on-ink)}
.nav button[aria-current="page"]{background:rgba(233,162,59,.14);color:var(--amber)}
.nav .badge{margin-left:auto;background:var(--crit);color:#fff;font:600 11px var(--f-mono);padding:2px 7px;border-radius:999px}
.side-tip{margin-top:auto;border:1px solid var(--ink-line);border-radius:16px;padding:14px;font-size:13px;color:var(--on-ink2);line-height:1.45}
.side-tip b{display:block;color:var(--on-ink);font:600 12px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.main{padding:28px 32px 44px;min-width:0}
.view{display:flex;flex-direction:column;gap:20px;min-width:0}
.view > *{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
.view > *:nth-child(2){animation-delay:.04s}.view > *:nth-child(3){animation-delay:.08s}.view > *:nth-child(4){animation-delay:.12s}.view > *:nth-child(5){animation-delay:.16s}
@keyframes rise{from{transform:translateY(10px)}to{transform:none}}

/* ---------- type & primitives ---------- */
.eyebrow{font:500 12px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}
.h1{font:700 clamp(26px,3vw,34px)/1.08 var(--f-display);letter-spacing:-.025em;text-wrap:balance}
.h2{font:700 19px/1.2 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
.h3{font:700 16px/1.25 var(--f-display)}
.sub{color:var(--text2);max-width:68ch}
.small{font-size:13px;color:var(--muted)}
.mono{font-family:var(--f-mono)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head > div{display:flex;flex-direction:column;gap:6px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;min-width:0;display:flex;flex-direction:column;gap:14px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-h > div{display:flex;flex-direction:column;gap:2px;min-width:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-73{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g-37{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:14px;padding:10px 16px;border-radius:12px;border:1px solid transparent;transition:transform .15s,background .2s,box-shadow .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-amber{background:var(--amber);color:var(--ink)}
.btn-amber:hover{box-shadow:0 8px 20px -10px rgba(233,162,59,.9)}
.btn-ink{background:var(--ink);color:var(--on-ink)}
.btn-ghost{background:var(--card);border-color:var(--line);color:var(--text)}
.btn-ghost:hover{background:var(--card2)}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--f-body);padding:4px 10px;border-radius:999px;white-space:nowrap}
.c-crit{background:#FBE1DC;color:#9E2A1F}.c-ser{background:#FCE6D2;color:#8E4208}.c-warn{background:#FFF0C7;color:#6E4E00}
.c-ok{background:#DDF1E4;color:#1F6B41}.c-info{background:#E3EAFB;color:#2A4FA8}.c-meta{background:#ECE6FA;color:#4E37A6}
.c-sel{background:var(--teal-soft);color:var(--teal)}.c-neutral{background:var(--line2);color:var(--text2)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.bar{height:8px;border-radius:99px;background:var(--line2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;width:0;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.kpi{display:flex;flex-direction:column;gap:6px}
.kpi .lbl{font-size:13px;color:var(--text2)}
.kpi .val{font:700 30px/1 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.delta{font:600 12px var(--f-body)}
.up{color:var(--ok)}.down{color:var(--crit)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--text2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font:500 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;background:var(--card2);border-bottom:1px solid var(--line);white-space:nowrap}
th button{border:0;background:none;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;padding:0;display:inline-flex;gap:4px;align-items:center}
td{padding:10px 12px;border-bottom:1px solid var(--line2);white-space:nowrap;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .15s}
tbody tr.click:hover{background:var(--card2);cursor:pointer}
.pill-score{display:inline-flex;align-items:center;gap:8px}
.pill-score .bar{width:60px;height:6px}

/* ---------- charts ---------- */
.viz{width:100%;min-width:0;position:relative}
.viz svg{display:block;overflow:visible}
.viz text{font:500 11px var(--f-mono);fill:var(--muted)}
.viz .grid-l{stroke:var(--line);stroke-width:1}
.viz .axis-l{stroke:#CFC3AE;stroke-width:1}
.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.3s cubic-bezier(.3,.6,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .8s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}}
.fadein{animation:fade .6s ease both}
@keyframes fade{from{opacity:0}}
.tip{position:fixed;z-index:80;pointer-events:none;background:var(--ink);color:var(--on-ink);font-size:13px;line-height:1.45;padding:9px 12px;border-radius:10px;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);max-width:260px}
.tip b{color:var(--amber);font-weight:600}
.heat{display:grid;gap:3px;font-size:12px}
.heat .cell{border-radius:4px;height:18px;transition:transform .15s}
.heat .cell:hover{transform:scale(1.25);outline:2px solid var(--ink)}
.heat .rl{color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:6px;align-self:center;font-size:12.5px}
.heat .cl{font:500 11px var(--f-mono);color:var(--muted);text-align:center}
.scale{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.scale i{width:20px;height:10px;border-radius:3px;display:inline-block}

/* ---------- student ---------- */
.hero-s{position:relative;background:var(--ink);color:var(--on-ink);border-radius:var(--r-xl);padding:26px 28px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:24px;align-items:center;overflow:hidden}
.hero-s::before{content:"";position:absolute;right:-80px;top:-120px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(233,162,59,.35),rgba(233,162,59,0) 70%)}
.hero-s > *{position:relative}
.hero-s .mascot{width:110px;height:110px;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.hero-s h1{font:800 clamp(26px,3.2vw,38px)/1.05 var(--f-display);letter-spacing:-.03em}
.hero-s p{color:var(--on-ink2)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.stat{display:flex;align-items:center;gap:8px;background:rgba(247,242,233,.07);border:1px solid var(--ink-line);border-radius:12px;padding:7px 12px;font-weight:600;font-size:14px}
.ring-wrap{position:relative;width:120px;height:120px;display:grid;place-items:center}
.ring-wrap svg{position:absolute;inset:0}
.ring-wrap .in{text-align:center;line-height:1.1}
.ring-wrap .in b{font:800 26px var(--f-display);display:block}
.ring-wrap .in span{font-size:12px;color:var(--on-ink2)}
.ring-anim{transition:stroke-dashoffset 1.4s cubic-bezier(.2,.7,.2,1)}
.subj{position:relative;border-radius:var(--r-lg);padding:18px;color:#fff;display:flex;flex-direction:column;gap:10px;overflow:hidden;min-height:170px;transition:transform .25s}
.subj:hover{transform:translateY(-3px)}
.subj::after{content:"";position:absolute;right:-30px;bottom:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.12)}
.subj .lvl{align-self:flex-start;font:600 12px var(--f-mono);background:rgba(255,255,255,.2);padding:3px 9px;border-radius:999px;letter-spacing:.04em}
.subj h3{font:700 21px var(--f-display);letter-spacing:-.01em}
.subj p{font-size:13.5px;opacity:.92}
.subj .bar{background:rgba(255,255,255,.25)}.subj .bar i{background:#fff}
.subj .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;font-weight:600}
.subj button{border:0;background:rgba(255,255,255,.95);color:var(--ink);font-weight:600;font-size:13px;padding:7px 12px;border-radius:10px;position:relative;z-index:1}
.faces{display:flex;gap:10px;flex-wrap:wrap}
.faces button{border:2px solid transparent;background:var(--card2);border-radius:16px;padding:8px 10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--text2);transition:transform .2s,border-color .2s}
.faces button:hover{transform:translateY(-3px)}
.faces button[aria-pressed="true"]{border-color:var(--ink);background:var(--card)}
.respond{background:var(--teal-soft);color:var(--teal);border-radius:var(--r-md);padding:12px 14px;font-size:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.mission{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line2);border-radius:var(--r-md);background:var(--card2)}
.mission .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none}
.mission .t{flex:1;min-width:0}
.mission .t b{display:block;font-size:14px}
.mission .xp{font:600 13px var(--f-mono);color:var(--amber-ink)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
.badge-i{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12.5px;font-weight:600;color:var(--text2);padding:10px 6px;border-radius:14px}
.badge-i.locked{opacity:.45;filter:grayscale(1)}
.badge-i svg{transition:transform .3s}
.badge-i:hover svg{transform:rotate(-8deg) scale(1.08)}

/* map */
.mapwrap{position:relative;width:100%;aspect-ratio:16/10;max-width:100%;border-radius:var(--r-xl);overflow:hidden;background:#0B4F49;box-shadow:var(--shadow)}
.mapwrap canvas{position:absolute;inset:0;display:block}
.node{position:absolute;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;border:3px solid #F7F2E9;display:grid;place-items:center;transition:transform .2s;z-index:2}
.node:hover{transform:translate(-50%,-50%) scale(1.12)}
.node.done{background:var(--teal2);color:#fff}
.node.current{background:var(--amber);color:var(--ink);width:52px;height:52px}
.node.current::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--amber);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{from{transform:scale(.8);opacity:1}to{transform:scale(1.45);opacity:0}}
.node.open{background:#F7F2E9;color:var(--ink)}
.node.locked{background:#1F2029;color:#8E8A80;border-color:#5D5A55}
.node.boss{width:56px;height:56px;background:#3B2A8F;color:#F7F2E9;border-color:#B9A6FF}
.node.boss.current{background:var(--amber);color:var(--ink);border-color:#F7F2E9}
.isl-label{position:absolute;transform:translate(-50%,-50%);font:700 13px var(--f-display);color:#F7F2E9;background:rgba(21,22,29,.55);backdrop-filter:blur(4px);padding:5px 11px;border-radius:999px;white-space:nowrap;z-index:2;pointer-events:none}
.avatar-pin{position:absolute;transform:translate(-50%,-100%);width:64px;height:64px;z-index:3;pointer-events:none;animation:hop 1.4s ease-in-out infinite}
@keyframes hop{50%{margin-top:-8px}}
.mapside{display:flex;flex-direction:column;gap:14px}

/* battle */
.stage{position:relative;width:100%;aspect-ratio:16/8;max-width:100%;border-radius:var(--r-xl);overflow:hidden;background:#141629}
.stage canvas{position:absolute;inset:0;display:block}
.hud{position:absolute;top:14px;display:flex;flex-direction:column;gap:6px;z-index:2;color:#F7F2E9;min-width:0}
.hud-l{left:16px}.hud-r{right:16px;align-items:flex-end}
.hud .nm{font:700 15px var(--f-display);background:rgba(21,22,29,.6);padding:4px 10px;border-radius:10px;backdrop-filter:blur(4px)}
.hearts{display:flex;gap:4px}
.hpbar{width:min(220px,34vw);height:14px;border-radius:99px;background:rgba(21,22,29,.7);border:2px solid rgba(247,242,233,.7);overflow:hidden}
.hpbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#E14A6C,#F28A5B);transition:width .5s cubic-bezier(.2,.7,.2,1)}
.ai-badge{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:2;font:500 12px var(--f-mono);letter-spacing:.06em;color:#F7F2E9;background:rgba(21,22,29,.6);padding:6px 12px;border-radius:999px;white-space:nowrap}
.combo{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:2;font:800 22px var(--f-display);color:var(--amber);text-shadow:0 2px 12px rgba(0,0,0,.6);animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:translateX(-50%) scale(.4)}}
.qpanel{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.qline{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.qtext{font:700 clamp(22px,2.6vw,30px)/1.15 var(--f-display);letter-spacing:-.02em}
.step-lbl{font:600 13px var(--f-body);color:var(--text2);display:flex;align-items:center;gap:8px}
.step-lbl i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font:600 12px var(--f-mono)}
.conf{display:flex;gap:8px;flex-wrap:wrap}
.conf button{border:1.5px solid var(--line);background:var(--card);padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px;transition:all .2s}
.conf button[aria-pressed="true"]{background:var(--meta);border-color:var(--meta);color:#fff}
.answers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.answers button{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:16px 10px;font:700 22px var(--f-display);transition:transform .15s,border-color .2s,background .2s}
.answers button:not(:disabled):hover{transform:translateY(-3px);border-color:var(--ink)}
.answers button:disabled{opacity:.45}
.answers.long{grid-template-columns:repeat(2,minmax(0,1fr))}
.answers.long button{font:600 16px/1.3 var(--f-body);padding:14px 12px}
.answers button.right{background:#DDF1E4;border-color:var(--ok);opacity:1}
.answers button.wrong{background:#FBE1DC;border-color:var(--crit);opacity:1;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{border-radius:var(--r-md);padding:12px 14px;font-size:14.5px;display:flex;gap:10px;align-items:flex-start}
.fb.good{background:#DDF1E4;color:#1F5A37}.fb.bad{background:#FBE7E1;color:#8A2A1D}.fb.info{background:#ECE6FA;color:#3F2C8A}
.result{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
.result .big{font:800 44px/1 var(--f-display);letter-spacing:-.03em}
.rstats{display:flex;gap:10px;flex-wrap:wrap}
.rstat{background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:10px 14px;min-width:110px}
.rstat b{display:block;font:700 22px var(--f-display)}
.rstat span{font-size:12.5px;color:var(--text2)}

/* lesson */
.cycle{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cycle div{border-radius:12px;padding:10px 12px;background:var(--card2);border:1px solid var(--line2);display:flex;gap:10px;align-items:center;font-weight:600;font-size:14px;color:var(--muted)}
.cycle div i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--line);font:600 12px var(--f-mono);flex:none}
.cycle div.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.cycle div.on i{background:var(--amber);color:var(--ink)}
.cycle div.done{color:var(--teal)}
.cycle div.done i{background:var(--teal);color:#fff}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:border-color .2s,transform .2s}
.opt:hover{transform:translateY(-2px)}
.opt[aria-pressed="true"]{border-color:var(--meta);background:#F4F0FD}
.opt b{font:700 15px var(--f-display)}
.opt span{font-size:13px;color:var(--text2)}
.engine{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.engine .small{color:var(--on-ink2)}
.lvls{display:flex;gap:6px}
.lvls i{flex:1;height:12px;border-radius:4px;background:rgba(247,242,233,.12);transition:background .4s}
.lvls i.on{background:var(--amber)}
.log{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow:auto}
.log div{border-left:3px solid var(--amber);padding:6px 10px;background:rgba(247,242,233,.05);border-radius:0 10px 10px 0;font-size:13px;line-height:1.4;animation:fade .4s}
.log div b{display:block;font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--amber);margin-bottom:2px}
.pause{border:2px dashed var(--teal2);background:var(--teal-soft);border-radius:var(--r-lg);padding:16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}

/* wellbeing */
.casel-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.casel-tabs button{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:10px 14px;font-weight:600;font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:8px;transition:all .2s}
.casel-tabs button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.casel-tabs button i{font-style:normal;font:600 11px var(--f-mono);opacity:.75}
.emos{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.emos button{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600;transition:all .2s}
.emos button[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft)}
.breath{display:grid;place-items:center;padding:12px 0}
.balloon{width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7FD3C4,#1B9C8E 60%,#0F6E64);display:grid;place-items:center;color:#fff;font:700 20px var(--f-display);transform:scale(.55);transition:transform 4s ease-in-out;box-shadow:0 20px 50px -20px rgba(15,110,100,.8)}
.scen{display:flex;flex-direction:column;gap:10px}
.scen button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;text-align:left;font-size:14.5px;transition:all .2s}
.scen button:hover:not(:disabled){border-color:var(--ink)}
.scen button.best{border-color:var(--ok);background:#E7F4EC}
.scen button.meh{border-color:var(--warn);background:#FFF6DC}
.scen button.no{border-color:var(--crit);background:#FBE9E5}
.link-acad{display:flex;gap:10px;align-items:center;background:var(--amber-soft);color:#6E3E00;border-radius:12px;padding:10px 12px;font-size:13.5px}
.slider{width:100%;accent-color:var(--teal)}

/* teacher / director */
.alert{display:grid;grid-template-columns:4px minmax(0,1fr);gap:12px;padding:12px 12px 12px 0;border-bottom:1px solid var(--line2)}
.alert:last-child{border-bottom:0}
.alert .sev{border-radius:4px}
.alert .top-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.alert b{font-size:14.5px}
.alert p{font-size:13.5px;color:var(--text2)}
.alert .act{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.groups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grp{border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
.grp b{font:800 28px var(--f-display)}
.copilot-out{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;min-height:420px;font-size:14.5px;line-height:1.55;display:flex;flex-direction:column;gap:10px}
.copilot-out h4{font:700 18px var(--f-display)}
.copilot-out h5{font:600 12px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--teal);margin:6px 0 0}
.copilot-out li{margin:3px 0}
.copilot-out ul{margin:0;padding-left:20px}
.caret{display:inline-block;width:8px;height:16px;background:var(--amber);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--text2)}
.field select,.field input,.field textarea{font:500 14px var(--f-body);color:var(--text);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text)}
.check input{accent-color:var(--teal);width:16px;height:16px}
.seg{display:flex;gap:4px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:4px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--text2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.funnel{display:flex;flex-direction:column;gap:8px}
.funnel .r{display:grid;grid-template-columns:180px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13.5px}
.funnel .r .bar{height:22px;border-radius:7px}
.funnel .r .bar i{border-radius:7px}

/* overlay drawer / modal */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(21,22,29,.45);backdrop-filter:blur(3px);display:flex;justify-content:flex-end;animation:fade .25s}
.drawer{width:min(520px,100%);height:100%;background:var(--work);overflow:auto;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;animation:slide .35s cubic-bezier(.2,.7,.2,1)}
@keyframes slide{from{transform:translateX(40px)}}
.overlay.center{justify-content:center;align-items:center;padding:16px}
.modal{width:min(640px,100%);max-height:100%;overflow:auto;background:var(--work);border-radius:var(--r-xl);padding:26px;display:flex;flex-direction:column;gap:14px;animation:rise .35s}
.x{margin-left:auto;border:0;background:var(--card);border:1px solid var(--line);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}

/* family */
.fam{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.week{display:flex;gap:8px;justify-content:space-between}
.week div{display:flex;flex-direction:column;align-items:center;gap:6px;font:500 12px var(--f-mono);color:var(--muted)}
.course{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--card2);border:1px solid var(--line2)}
.course .cv{width:52px;height:52px;border-radius:12px;flex:none;display:grid;place-items:center}
.course .t{flex:1;min-width:0}
.msg{background:var(--card2);border-radius:16px 16px 16px 4px;padding:12px 14px;font-size:14px}
.msg.me{background:var(--ink);color:var(--on-ink);border-radius:16px 16px 4px 16px;align-self:flex-end}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--on-ink);padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;display:flex;gap:10px;align-items:center;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);animation:rise .3s}

/* ---------- v2: top actions, co-brand ---------- */
.top-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.iconbtn{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--text);flex:none;transition:background .2s,color .2s}
.iconbtn:hover{background:var(--card2)}
.iconbtn[aria-pressed="false"]{color:var(--muted)}
.iconbtn.light{background:rgba(247,242,233,.08);border-color:rgba(247,242,233,.22);color:var(--on-ink)}
.iconbtn.light:hover{background:rgba(247,242,233,.16)}
.cobrand{display:inline-flex;align-items:center;gap:8px;font:700 13px var(--f-body);padding:5px 12px 5px 8px;border-radius:999px;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cobrand img{height:22px;width:auto;max-width:64px;object-fit:contain;border-radius:5px;background:#fff;padding:1px}
.cobrand .x{opacity:.7;font-weight:500}
.who > div{min-width:0}
.who b,.who span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-lg{padding:13px 22px;font-size:15.5px;border-radius:14px;align-self:flex-start}
body.touring{padding-block-end:220px}

/* ---------- game layer ---------- */
.hudbar{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--ink);color:var(--on-ink);border-radius:var(--r-lg);padding:9px 14px 9px 9px}
.hudbar::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 92% 0%,rgba(233,162,59,.22),transparent 45%);pointer-events:none}
.hud-av{width:50px;height:50px;border-radius:14px;background:var(--ink3);display:grid;place-items:center;flex:none}
.hud-lv{display:flex;flex-direction:column;gap:4px;flex:1;min-width:150px;max-width:340px}
.hud-lv b{font:800 15px var(--f-display)}
.hud-lv > span{font:500 11px var(--f-mono);color:var(--on-ink2)}
.xpbar{height:10px;border-radius:99px;background:rgba(247,242,233,.12);overflow:hidden}
.xpbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#E9A23B,#FFD98A);transition:width .8s cubic-bezier(.2,.7,.2,1)}
.hud-sp{flex:1}
.hud-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(247,242,233,.07);border:1px solid var(--ink-line);border-radius:12px;padding:6px 11px;font:700 15px var(--f-display);color:var(--on-ink);font-variant-numeric:tabular-nums}
button.hud-pill{border-color:var(--amber);background:rgba(233,162,59,.2);animation:glowp2 1.6s ease-in-out infinite}
@keyframes glowp2{50%{box-shadow:0 0 0 6px rgba(233,162,59,.18)}}
.stat-btn{border:1px solid var(--amber)!important;background:rgba(233,162,59,.2)!important;color:var(--on-ink);animation:glowp2 1.6s ease-in-out infinite}
.float-xp{position:fixed;z-index:95;pointer-events:none;font:800 22px var(--f-display);color:var(--amber);-webkit-text-stroke:1px rgba(21,22,29,.6);text-shadow:0 3px 12px rgba(0,0,0,.35);animation:floatup 1.25s ease-out forwards;white-space:nowrap}
@keyframes floatup{0%{transform:translate(-50%,0) scale(.6);opacity:0}15%{opacity:1;transform:translate(-50%,-12px) scale(1.15)}100%{transform:translate(-50%,-80px) scale(1);opacity:0}}
.cf-root{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.cf-root i{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px}
.gscreen{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#2E2458 0%,#1A1B26 62%,#15161D 100%);color:var(--on-ink);border-radius:var(--r-xl);padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.gscreen > *{position:relative}
.gscreen > .gstars{position:absolute;inset:0;pointer-events:none;opacity:.75;background-image:radial-gradient(1.6px 1.6px at 8% 14%,#F7F2E9,transparent),radial-gradient(1.4px 1.4px at 22% 62%,#F7F2E9,transparent),radial-gradient(1.8px 1.8px at 41% 9%,#FFD98A,transparent),radial-gradient(1.4px 1.4px at 63% 28%,#F7F2E9,transparent),radial-gradient(1.6px 1.6px at 79% 8%,#F7F2E9,transparent),radial-gradient(1.4px 1.4px at 91% 44%,#FFD98A,transparent),radial-gradient(1.4px 1.4px at 54% 78%,#F7F2E9,transparent),radial-gradient(1.6px 1.6px at 12% 88%,#F7F2E9,transparent),radial-gradient(1.4px 1.4px at 86% 86%,#F7F2E9,transparent)}
.gscreen .eyebrow{color:var(--amber)}
.gscreen .small{color:var(--on-ink2)}
.gtitle{font:800 clamp(22px,2.6vw,30px)/1.14 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.gtitle.sm{font-size:clamp(18px,2vw,21px);line-height:1.25}
.qrow{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.step-lbl.dk{color:var(--on-ink2)}
.step-lbl.dk i{background:var(--amber);color:var(--ink)}
.check.dk{color:var(--on-ink2);font-size:13.5px}
.field.dk{color:var(--on-ink2)}
.field.dk textarea{background:rgba(247,242,233,.06);border-color:rgba(247,242,233,.2);color:var(--on-ink)}
.field.dk textarea::placeholder{color:rgba(247,242,233,.4)}
.gscreen .rstat,.modal.gm .rstat{background:rgba(247,242,233,.06);border-color:rgba(247,242,233,.14)}
.gscreen .rstat span,.modal.gm .rstat span{color:var(--on-ink2)}
.gscreen .pause{color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{position:relative;border:0;border-radius:18px;padding:18px 10px;font:800 24px var(--f-display);color:var(--ink);background:#F7F2E9;box-shadow:0 6px 0 #BDB2A0;transition:transform .12s,box-shadow .12s,background .2s}
.tile:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 9px 0 #BDB2A0}
.tile:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 #BDB2A0}
.tile:disabled{opacity:.55}
.tile.right{background:#8BE3BC;box-shadow:0 6px 0 #2E8B57;opacity:1;animation:bump .45s}
.tile.wrong{background:#F7A59A;box-shadow:0 6px 0 #C8382B;opacity:1;animation:shake .4s}
.tiles.long{grid-template-columns:repeat(2,minmax(0,1fr))}
.tiles.long .tile{font:700 16px/1.3 var(--f-body);padding:15px 12px}
@keyframes bump{40%{transform:scale(1.07)}}
.bet{display:flex;gap:10px;flex-wrap:wrap}
.bet button{display:inline-flex;align-items:center;gap:8px;border:2px solid rgba(247,242,233,.18);background:rgba(247,242,233,.06);color:var(--on-ink);border-radius:14px;padding:9px 14px;font-weight:700;font-size:14px;transition:all .2s}
.bet button:hover:not(:disabled){border-color:rgba(247,242,233,.45)}
.bet button .st{display:inline-flex;gap:1px}
.bet button[aria-pressed="true"]{background:var(--meta);border-color:#B9A6FF;box-shadow:0 0 0 4px rgba(106,79,200,.35)}
.lumi-say{display:flex;gap:10px;align-items:flex-end}
.lumi-say .bub{position:relative;background:#F7F2E9;color:var(--ink);border-radius:16px 16px 16px 4px;padding:10px 14px;font-size:14.5px;font-weight:500;line-height:1.45;max-width:520px;animation:fade .3s}
.stages{display:flex;align-items:center}
.stages .st{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:600 13px var(--f-mono);background:rgba(247,242,233,.08);color:var(--on-ink2);border:2px solid rgba(247,242,233,.2);flex:none;transition:all .3s}
.stages .st.done{background:var(--teal2);color:#fff;border-color:var(--teal2)}
.stages .st.on{background:var(--amber);color:var(--ink);border-color:#FFD98A;box-shadow:0 0 0 6px rgba(233,162,59,.22)}
.stages .ln{flex:1;height:3px;background:rgba(247,242,233,.15);min-width:8px}
.stages .ln.done{background:var(--teal2)}
.pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pk{border:2px solid rgba(247,242,233,.16);background:rgba(247,242,233,.05);color:var(--on-ink);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:all .2s}
.pk:hover{transform:translateY(-3px);border-color:rgba(247,242,233,.4)}
.pk[aria-pressed="true"]{border-color:var(--amber);background:rgba(233,162,59,.14);box-shadow:0 0 0 4px rgba(233,162,59,.16)}
.pk-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff}
.pk b{font:700 16px var(--f-display)}
.pk span:last-child{font-size:13px;color:var(--on-ink2)}
.bigstars{display:flex;justify-content:center;gap:10px}
.bigstars span{animation:starpop .6s cubic-bezier(.3,1.6,.5,1) both}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}}
.pillars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.pillar{position:relative;overflow:hidden;border:0;border-radius:20px;padding:16px 16px 14px;text-align:left;color:#fff;background:linear-gradient(140deg,var(--c1),var(--c2));display:flex;flex-direction:column;gap:6px;min-height:170px;transition:transform .25s,box-shadow .25s}
.pillar:hover{transform:translateY(-4px) rotate(-.5deg);box-shadow:0 18px 30px -16px var(--c2)}
.pillar .pl-tag{align-self:flex-start;font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.22);padding:3px 8px;border-radius:999px;position:relative;z-index:1}
.pillar b{font:800 21px/1.1 var(--f-display);letter-spacing:-.01em;position:relative;z-index:1}
.pillar .pl-d{font-size:13px;opacity:.94;position:relative;z-index:1;max-width:85%}
.pillar .pl-go{margin-top:auto;align-self:flex-start;display:inline-flex;gap:6px;align-items:center;background:#fff;color:var(--ink);font-weight:700;font-size:13px;padding:6px 12px;border-radius:999px;position:relative;z-index:1}
.pillar .pl-ic{position:absolute;right:-14px;bottom:-16px;opacity:.22;transform:rotate(-12deg)}

/* quests (gym + SEL) */
.quests{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.quests.q5{grid-template-columns:repeat(5,minmax(0,1fr))}
.quest{position:relative;border:0;text-align:left;border-radius:20px;padding:0;overflow:hidden;background:var(--ink);color:var(--on-ink);display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s;min-width:0}
.quest:hover{transform:translateY(-4px);box-shadow:0 18px 30px -18px rgba(21,22,29,.7)}
.quest .art{width:100%;height:112px;display:block}
.quest .qb{padding:11px 13px 13px;display:flex;flex-direction:column;gap:3px}
.quest .qb b{font:700 15.5px/1.2 var(--f-display)}
.quest .qb > span{font-size:12.5px;color:var(--on-ink2);line-height:1.35}
.quest .tag{position:absolute;top:9px;left:9px;font:600 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;background:rgba(21,22,29,.65);color:#F7F2E9;padding:4px 8px;border-radius:999px;backdrop-filter:blur(4px)}
.quest .stars3{display:flex;gap:2px;margin-top:3px}
.quest[aria-pressed="true"]{box-shadow:0 0 0 3px var(--amber),0 18px 30px -18px rgba(21,22,29,.7)}

/* cognitive games */
.jars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;max-width:400px;margin:0 auto;width:100%}
.jar{aspect-ratio:1;border-radius:22px;border:2px solid rgba(247,242,233,.14);background:rgba(247,242,233,.05);display:grid;place-items:center;transition:background .2s,box-shadow .2s,transform .12s;max-width:100%}
.jar:disabled{cursor:default}
.jar.lit{background:radial-gradient(circle,#FFF3C4 0%,#E9A23B 45%,rgba(233,162,59,.15) 78%);box-shadow:0 0 42px rgba(233,162,59,.75);transform:scale(1.05)}
.jar.tap{background:radial-gradient(circle,#CFF5EC 0%,#2BB3A3 50%,rgba(43,179,163,.2) 80%)}
.jar.bad{background:radial-gradient(circle,#FFD3CC,#F2556F 60%);animation:shake .4s}
.holes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;max-width:520px;margin:0 auto;width:100%}
.hole{aspect-ratio:1;border-radius:50%;border:0;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 75%,#0B0C12 42%,#2A2C36 72%);box-shadow:inset 0 -8px 0 rgba(0,0,0,.35),0 0 0 3px rgba(247,242,233,.08);max-width:100%}
.hole .pop{position:absolute;inset:14%;display:grid;place-items:center;transform:translateY(120%);transition:transform .16s ease-out}
.hole.up .pop{transform:none}
.hole.hit .pop{transform:scale(1.3);opacity:0;transition:all .2s}
.tbar{height:8px;border-radius:99px;background:rgba(247,242,233,.12);overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#E9A23B,#FFD98A);border-radius:99px;transition:width .1s linear}
.stroop{font:800 clamp(44px,8vw,86px)/1 var(--f-display);text-align:center;letter-spacing:-.02em;padding:14px 0;text-shadow:0 4px 20px rgba(0,0,0,.4)}
.rule{align-self:center;font:700 15px var(--f-body);background:rgba(247,242,233,.08);border:1px solid rgba(247,242,233,.2);padding:9px 16px;border-radius:999px;text-align:center}
.rule.flash{background:var(--amber);color:var(--ink);animation:bump .5s}
.swatches{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.swatch{border:0;border-radius:16px;padding:16px 6px;font:800 15px var(--f-display);color:var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.35);transition:transform .12s}
.swatch:active{transform:translateY(4px)}
.seqrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.seqrow .sq{width:68px;height:68px;border-radius:16px;background:rgba(247,242,233,.07);border:1px solid rgba(247,242,233,.15);display:grid;place-items:center;font:800 26px var(--f-display)}
.seqrow .sq.q{border:2px dashed var(--amber);color:var(--amber);animation:glowp2 1.4s infinite}
.tile svg{display:block;margin:0 auto}
.skillup{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) auto;gap:12px;align-items:center;font-size:14px}
.skillup .bar{background:rgba(247,242,233,.12);height:10px}

/* SEL games */
.scene{width:100%;height:auto;border-radius:18px;display:block;max-width:100%}
.det{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.det-card{background:radial-gradient(circle at 50% 40%,#3A2F6B,#1F2029 75%);border-radius:20px;padding:10px;display:grid;place-items:center;position:relative}
.det-txt{display:flex;flex-direction:column;gap:8px;min-width:0}
.meter{display:flex;align-items:center;gap:10px;min-width:200px}
.meter .track{flex:1;height:12px;border-radius:99px;background:rgba(247,242,233,.12);overflow:hidden}
.meter .track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#F2556F,#FFD24A 50%,#2BB3A3);transition:width .8s cubic-bezier(.2,.7,.2,1)}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{border:2px solid rgba(247,242,233,.16);background:rgba(247,242,233,.06);color:var(--on-ink);text-align:left;border-radius:14px;padding:11px 14px;font-size:15px;font-weight:600;transition:all .2s;display:flex;gap:12px;align-items:center}
.choice:hover:not(:disabled){border-color:var(--amber);transform:translateX(4px)}
.choice .k{width:28px;height:28px;border-radius:8px;background:rgba(247,242,233,.12);display:grid;place-items:center;font:600 13px var(--f-mono);flex:none}
.choice.sel{border-color:var(--amber);background:rgba(233,162,59,.16)}
.choice.best{border-color:#7FE0B0;background:rgba(46,139,87,.28)}
.choice.meh{border-color:#FFD98A;background:rgba(185,130,0,.24)}
.choice.no{border-color:#F7A59A;background:rgba(200,56,43,.24)}
.choice:disabled{cursor:default}
.breath-g{position:relative;height:350px;border-radius:20px;overflow:hidden;background:linear-gradient(#8ED1E6,#CDEBF2 68%,#E9F6F2);display:grid;place-items:end center}
.breath-g .clouds{position:absolute;inset:0;width:100%;height:100%}
.bal-svg{position:relative;max-width:100%;height:auto}
.bcount{position:absolute;top:14px;right:20px;font:800 46px var(--f-display);color:var(--ink);opacity:.75}
.bmsg{text-align:center;font-weight:600;font-size:15px;min-height:22px}
.hold{align-self:center;border:0;border-radius:999px;background:var(--amber);color:var(--ink);font:800 17px var(--f-display);padding:16px 30px;box-shadow:0 8px 0 #B5781F;user-select:none;-webkit-user-select:none;touch-action:none;transition:transform .1s,box-shadow .1s}
.hold.on{transform:translateY(6px);box-shadow:0 2px 0 #B5781F}
.light-g{display:grid;grid-template-columns:118px minmax(0,1fr);gap:18px;align-items:start}
.tlight{width:110px;background:#0E0F16;border-radius:30px;padding:14px 10px;display:flex;flex-direction:column;gap:12px;align-items:center;box-shadow:inset 0 0 0 3px #2A2C36}
.tl{width:70px;height:70px;border-radius:50%;border:0;display:block;background:#2A2C36;transition:all .35s;flex:none}
button.tl{background:#7A2B3A;animation:glowr 1.2s ease-in-out infinite}
@keyframes glowr{50%{box-shadow:0 0 0 10px rgba(242,85,111,.25)}}
.tl.r.on{background:#F2556F;box-shadow:0 0 34px #F2556F;animation:none}
.tl.y.on{background:#FFD24A;box-shadow:0 0 34px #FFD24A}
.tl.g.on{background:#3DDC97;box-shadow:0 0 34px #3DDC97}
.tl-l{font:600 12px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--on-ink2)}
.light-r{display:flex;flex-direction:column;gap:12px;min-width:0}

/* workbook */
.wb{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
.page{background:#FFFEFA;color:var(--ink);border-radius:6px;border:1px solid #EFE7D8;box-shadow:0 1px 0 rgba(0,0,0,.04),0 22px 44px -26px rgba(21,22,29,.55);padding:26px 28px;display:flex;flex-direction:column;gap:12px;font-size:14px;transform:rotate(-1deg)}
.pg-head{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:8px}
.pg-n{font:800 22px var(--f-display);background:var(--ink);color:var(--on-ink);border-radius:8px;padding:2px 10px}
.pg-t{font:800 24px var(--f-display);letter-spacing:-.01em}
.pg-ex{display:flex;flex-direction:column;gap:6px}
.pg-code{display:flex;gap:14px;align-items:center;border:2px dashed #D8CCB6;border-radius:12px;padding:12px;margin-top:4px}
.pg-code b{display:block;font:700 15px var(--f-display)}
.device{background:#1F2029;border-radius:34px;padding:12px;box-shadow:0 24px 50px -24px rgba(21,22,29,.7);width:100%;max-width:360px;align-self:center}
.viewfinder{position:relative;border-radius:24px;overflow:hidden;aspect-ratio:3/4;background:#4A4C58}
.vf-page{position:absolute;left:50%;top:50%;width:520px;transform:translate(-50%,-50%) scale(.56) rotate(-4deg);filter:brightness(.92) saturate(.9)}
.vf-page .page{transform:none;box-shadow:none}
.cn{position:absolute;width:40px;height:40px;border:4px solid #F7F2E9;transition:all .6s cubic-bezier(.2,.7,.2,1)}
.cn.c1{left:9%;top:9%;border-right:0;border-bottom:0;border-radius:12px 0 0 0}
.cn.c2{right:9%;top:9%;border-left:0;border-bottom:0;border-radius:0 12px 0 0}
.cn.c3{left:9%;bottom:9%;border-right:0;border-top:0;border-radius:0 0 0 12px}
.cn.c4{right:9%;bottom:9%;border-left:0;border-top:0;border-radius:0 0 12px 0}
.scanning .cn{border-color:#2BB3A3}
.scanning .cn.c1{left:17%;top:14%}.scanning .cn.c2{right:17%;top:14%}.scanning .cn.c3{left:17%;bottom:14%}.scanning .cn.c4{right:17%;bottom:14%}
.scanl{position:absolute;left:8%;right:8%;height:3px;top:12%;background:linear-gradient(90deg,transparent,#2BB3A3,transparent);box-shadow:0 0 18px #2BB3A3;animation:scanmv 1.5s ease-in-out infinite alternate}
@keyframes scanmv{to{top:86%}}
.vf-ok{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:8px;background:rgba(15,110,100,.62);color:#fff;text-align:center;font:800 20px var(--f-display);animation:fade .4s}
.vf-ok span{width:64px;height:64px;border-radius:50%;background:#fff;color:var(--teal);display:grid;place-items:center;margin:0 auto;animation:bump .5s}
.pagesgrid{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:4px}
.pagesgrid i{aspect-ratio:3/4;border-radius:3px;background:var(--line2)}
.pagesgrid i.on{background:var(--teal2)}
.pagesgrid i.new{background:var(--amber);animation:bump .6s}

/* shop + chest */
.shop{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:16px;align-items:start}
.stagebox{background:radial-gradient(circle at 50% 35%,#3A2F6B,#15161D 75%);border-radius:var(--r-xl);padding:24px;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--on-ink);position:sticky;top:80px;text-align:center}
.stagebox .lumi-big{animation:bob 3s ease-in-out infinite}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px}
.item{border:2px solid var(--line);background:var(--card);border-radius:18px;padding:10px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13.5px;font-weight:600;transition:transform .2s,border-color .2s}
.item:hover{transform:translateY(-3px)}
.item[aria-pressed="true"]{border-color:var(--meta);background:#F4F0FD}
.item .price{display:inline-flex;align-items:center;gap:4px;font:600 12.5px var(--f-mono);color:var(--amber-ink)}
.item.owned .price{color:var(--teal)}
.modal.gm{position:relative;overflow:hidden;background:radial-gradient(circle at 50% 0%,#3A2F6B,#15161D 72%);color:var(--on-ink)}
.modal.gm > *{position:relative}
.modal.gm > .cf-root{position:absolute}
.chest-wrap{position:relative;display:grid;place-items:center;height:250px}
.rays{position:absolute;left:50%;top:50%;width:380px;height:380px;margin:-190px 0 0 -190px;border-radius:50%;background:repeating-conic-gradient(rgba(255,217,138,.34) 0deg 10deg,transparent 10deg 30deg);-webkit-mask-image:radial-gradient(circle,#000 22%,transparent 68%);mask-image:radial-gradient(circle,#000 22%,transparent 68%);opacity:0;transition:opacity .6s;animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.opened .rays{opacity:1}
.chest{position:relative;animation:wobble 1.1s ease-in-out infinite;max-width:100%}
.opened .chest{animation:none}
@keyframes wobble{0%,100%{transform:rotate(0)}20%{transform:rotate(-4deg)}40%{transform:rotate(4deg)}60%{transform:rotate(-2deg)}}
.chest .lid{transform-box:fill-box;transform-origin:0% 100%;transition:transform .7s cubic-bezier(.3,1.6,.5,1)}
.opened .chest .lid{transform:translate(-8px,-30px) rotate(-24deg)}
.chest .glow{opacity:0;transition:opacity .4s .25s}
.opened .chest .glow{opacity:1}

/* teacher + psych */
.ba{display:grid;grid-template-columns:130px minmax(0,1fr) 64px;gap:12px 14px;align-items:center}
.ba-l{font-size:14px;font-weight:600}
.ba-track{display:flex;gap:2px;height:28px}
.ba-track i{display:block;height:100%;border-radius:4px;transform-origin:left;animation:growx .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes growx{from{transform:scaleX(0)}}
.case{display:grid;grid-template-columns:4px minmax(0,1fr);gap:12px;border:1px solid var(--line2);border-radius:14px;padding:12px 12px 12px 0;background:var(--card);text-align:left;width:100%;transition:border-color .2s,background .2s;overflow:hidden}
.case:hover{background:var(--card2)}
.case[aria-pressed="true"]{border-color:var(--ink);background:var(--card2)}
.case .sev{border-radius:0 4px 4px 0}
.case b{font-size:14.5px}
.tl-steps{display:flex;flex-direction:column}
.tl-step{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:start;position:relative;padding-bottom:14px;font-size:14px}
.tl-step::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.tl-step:last-child::before{display:none}
.tl-dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--line2);color:var(--muted);border:2px solid var(--line)}
.tl-step.done .tl-dot{background:var(--teal);color:#fff;border-color:var(--teal)}
.tl-step .when{font:500 12px var(--f-mono);color:var(--muted)}
.crit{border:1px solid var(--line2);border-radius:16px;padding:16px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:center;background:var(--card);transition:opacity .2s}
.crit.off{opacity:.55}
.crit-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.crit-res{background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;font-size:13.5px}
.crit-res b{font:800 28px/1.1 var(--f-display)}
.switch{position:relative;width:44px;height:26px;flex:none;display:inline-block}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:99px;background:#D8CCB6;transition:.2s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked + span{background:var(--teal)}
.switch input:checked + span::after{transform:translateX(18px)}
.switch input:focus-visible + span{outline:3px solid var(--amber);outline-offset:2px}
.cert{background:#FFFDF8;border-radius:16px;padding:10px;border:1px solid var(--line)}
.cert-in{border:2px solid var(--amber);border-radius:10px;padding:26px 22px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:radial-gradient(circle at 50% 0%,rgba(233,162,59,.14),transparent 60%)}
.cert-name{font:800 30px var(--f-display);letter-spacing:-.02em}
.cert-sign{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:100%;margin-top:18px;font-size:12px;color:var(--muted)}
.cert-sign hr{border:0;border-top:1px solid var(--text2);margin:0 0 6px}
.swrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:34px;height:34px;border-radius:10px;border:3px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);transition:transform .15s}
.sw[aria-pressed="true"]{border-color:var(--ink);transform:scale(1.08)}
.swrow input[type=color]{width:46px;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:2px}

/* tour */
.tour{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:85;width:min(640px,calc(100% - 32px));background:rgba(21,22,29,.95);backdrop-filter:blur(10px);color:var(--on-ink);border-radius:20px;padding:14px 16px;box-shadow:0 24px 60px -18px rgba(0,0,0,.65);display:flex;flex-direction:column;gap:10px;animation:fade .3s}
.tour .tprog{height:4px;border-radius:99px;background:rgba(247,242,233,.15);overflow:hidden}
.tour .tprog i{display:block;height:100%;background:var(--amber);width:0}
.tour h3{font:700 18px/1.2 var(--f-display)}
.tour p{font-size:14px;color:var(--on-ink2)}
.tour .tctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tour .tctl button{border:1px solid var(--ink-line);background:rgba(247,242,233,.06);color:var(--on-ink);border-radius:10px;padding:7px 11px;font-weight:600;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.tour .tctl button:disabled{opacity:.4}
.tour .dots{display:flex;gap:5px;margin-left:auto}
.tour .dots i{width:7px;height:7px;border-radius:50%;background:rgba(247,242,233,.25)}
.tour .dots i.on{background:var(--amber)}
@media (max-width:1250px){.quests.q5{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}}
@media (max-width:1100px){.pillars{grid-template-columns:repeat(2,minmax(0,1fr))}.shop,.wb{grid-template-columns:minmax(0,1fr)}.stagebox{position:static}}
@media (max-width:900px){.crit{grid-template-columns:minmax(0,1fr)}.det{grid-template-columns:minmax(0,1fr)}.det-card{justify-self:center}}
@media (max-width:640px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pick{grid-template-columns:minmax(0,1fr)}
  .swatches{grid-template-columns:repeat(2,minmax(0,1fr))}
  .light-g{grid-template-columns:86px minmax(0,1fr);gap:12px}
  .tlight{width:84px}.tl{width:54px;height:54px}
  .ba{grid-template-columns:94px minmax(0,1fr) 52px;gap:10px}
  .holes{gap:10px}.jars{gap:10px}
  .seqrow .sq{width:52px;height:52px}
  .top-act .btn span.hide-sm{display:none}
  .tour .dots{display:none}
  .gscreen{padding:16px}
  .lumi-say .bub{font-size:14px}
  .breath-g{height:320px}
}

/* ---------- v2: extras (cognitive color, before/after, courses, tour, co-brand) ---------- */
:root{--cog:#A43F8E;--school:#E9A23B;--school-ink:#15161D}
.top-act{margin-left:auto}
.cobrand{background:var(--school);color:var(--school-ink)}
.cobrand[hidden]{display:none}
.cobrand span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.shell.cobr .side{box-shadow:inset 0 4px 0 var(--school)}
.ba{grid-template-columns:minmax(0,190px) minmax(0,1fr) minmax(0,150px)}
.ba-pair{display:flex;flex-direction:column;gap:4px;min-width:0}
.ba-pair .ba-track{height:12px}
.ba-v{font-size:13px;color:var(--text2);text-align:right;white-space:nowrap}
.ba-v b{color:var(--teal)}
.ba-sum{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ba-sum > div{display:flex;flex-direction:column;gap:2px}
.ba-sum b{font:800 30px/1 var(--f-display);letter-spacing:-.02em}
.ba-arrow{color:var(--muted);display:grid}
.ba-save{margin-left:auto;background:var(--teal-soft);border-radius:14px;padding:10px 14px}
.ba-save b{color:var(--teal)}
.cogrow{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 34px 74px;gap:10px;align-items:center;font-size:14px}
.cogrow .small{text-align:right;white-space:nowrap}
.tcourse .tc-top{display:flex;gap:12px;align-items:center}
.tcourse .cv{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;color:#fff;flex:none}
.tcourse .t{flex:1;min-width:0}
.tcourse .t b{display:block;font:700 16px/1.25 var(--f-display)}
.cert-qr{display:flex;gap:10px;align-items:center;margin-top:10px}
.tour-hl{outline:3px solid var(--amber)!important;outline-offset:5px;animation:hlp 1.8s ease-in-out infinite}
@keyframes hlp{50%{outline-color:rgba(233,162,59,.3)}}
.tour .tprog i{transition:width .4s}
.tour .tctl .tgo{background:var(--amber);color:var(--ink);border-color:var(--amber)}
.hold{min-width:min(340px,100%)}
.toast{width:max-content;max-width:calc(100vw - 32px)}
.privacy{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--muted)}
[hidden]{display:none!important}
.fb > svg,.link-acad > svg,.respond > svg,.privacy > svg{flex:none}
.respond > span{flex:1 1 220px;min-width:0}
.card-h > div:not(:first-child){flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px}
.card-h > div.legend:not(:first-child){gap:6px 14px}
.top.cb .dc-long{display:none}
.opened .chest .lid{transform:rotate(-32deg) translate(-2px,-4px)}
.quests.q2{grid-template-columns:repeat(2,minmax(0,1fr))}
.dchest{display:flex;gap:12px;align-items:center;background:var(--ink);color:var(--on-ink);border-radius:var(--r-md);padding:12px 14px}
.dchest-ic{width:46px;height:46px;border-radius:12px;background:rgba(233,162,59,.18);color:var(--amber);display:grid;place-items:center;flex:none}
.dchest b{display:block;font:700 15px var(--f-display)}
.dchest .small{color:var(--on-ink2)}
.dsegs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:8px}
.dsegs i{height:8px;border-radius:99px;background:rgba(247,242,233,.14)}
.dsegs i.on{background:linear-gradient(90deg,#E9A23B,#FFD98A)}
.dchest-n{font:800 20px var(--f-display);color:var(--amber);flex:none}
.dchest.won{box-shadow:0 0 0 3px rgba(233,162,59,.45)}
@media (max-width:640px){
  .top{gap:10px}
  .top-act{order:2;gap:6px}
  .roles{order:3;flex-basis:100%}
  .dc-long{display:none}
  .cobrand{max-width:120px}
  .ai-badge{top:auto;bottom:10px;left:10px;transform:none;font-size:11px;padding:5px 9px}
  .hud .nm{font-size:13px}
  .combo{bottom:auto;top:40%;font-size:19px}

/* ---------- v4: mode switch, inline guided tour, Modo escuela ---------- */
/* Modo escuela: "cuaderno de colores". Same brand amber and ink, rounder type, bigger targets,
   one main action per screen, WhatsApp-familiar messages. Demo mode keeps the dense, data-first look. */
:root{--e-bg:#FDF6EA;--e-line:#F0E2C8;--e-soft:#FFF8EC;--e-sky:#DDEFFF;--e-sun:#FFF1D2;--e-mint:#E1F5EA;--e-lilac:#ECE6FA;
  --f-round:'Fredoka','Nunito','Trebuchet MS',sans-serif;--f-friendly:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif}
.modeseg{display:flex;gap:3px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;flex:none}
.modeseg button{border:0;background:transparent;padding:7px 12px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--text2);white-space:nowrap}
.modeseg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.modeseg .ms{display:none}
.top.cb .modeseg .ml{display:none}.top.cb .modeseg .ms{display:inline}
.top.cb #tourBtn .hide-sm{display:none}
.foot-note{text-align:center;font-size:12.5px;color:var(--muted);margin-top:14px}

/* guided tour bar (lives inside the page, so it is always on screen) */
.tourbar{position:relative;z-index:35;background:linear-gradient(120deg,#15161D 0%,#232046 100%);color:var(--on-ink);border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;margin-bottom:18px;box-shadow:0 18px 40px -22px rgba(21,22,29,.8);animation:rise .35s cubic-bezier(.2,.7,.2,1)}
.tb-prog{height:5px;border-radius:99px;background:rgba(247,242,233,.15);overflow:hidden}
.tb-prog i{display:block;height:100%;background:var(--amber);transition:width .4s}
.tb-row{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.tb-txt{flex:1;min-width:240px;display:flex;flex-direction:column;gap:4px}
.tb-k{font:500 11.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--amber)}
.tourbar h3{font:700 20px/1.2 var(--f-display)}
.tourbar p{color:var(--on-ink2);font-size:14.5px;max-width:72ch}
.tb-ctl{display:flex;gap:6px;flex-wrap:wrap}
.tb-ctl button{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(247,242,233,.2);background:rgba(247,242,233,.07);color:var(--on-ink);border-radius:12px;padding:9px 12px;font-weight:700;font-size:14px}
.tb-ctl button:hover:not(:disabled){background:rgba(247,242,233,.14)}
.tb-ctl button:disabled{opacity:.4}
.tb-ctl .tgo{background:var(--amber);border-color:var(--amber);color:var(--ink)}
.tb-ctl .tgo:hover{background:#F2B65A!important}
.tb-ctl [data-tauto][aria-pressed="true"]{background:rgba(233,162,59,.22);border-color:var(--amber)}
@media (min-width:901px){.tourbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px)}}
@media (max-width:640px){.tb-ctl button span{display:none}.tourbar h3{font-size:18px}.modeseg .ml{display:none}.modeseg .ms{display:inline}}

/* ---------- Modo escuela shell ---------- */
body.school{--f-display:var(--f-round);--f-body:var(--f-friendly);background:var(--e-bg);font-size:16px}
.school .shell{display:flex;flex-direction:column;background:linear-gradient(180deg,#FFFDF8,#FFF8EC);border-color:var(--e-line)}
.school .side{background:transparent;color:var(--text);padding:18px 20px 0;gap:0;box-shadow:none!important}
.school .main{background:transparent;padding:22px 28px 40px}
.school .view{max-width:1060px;margin:0 auto;width:100%;gap:18px}
.school .tourbar{max-width:1060px;margin:0 auto 18px;width:100%}
.e-tabs{display:flex;gap:6px;justify-content:center;padding:6px;background:#fff;border:1px solid var(--e-line);border-radius:22px;box-shadow:0 2px 0 rgba(21,22,29,.04),0 14px 26px -22px rgba(21,22,29,.35);width:fit-content;max-width:100%;margin:0 auto}

.e-stats{display:flex;gap:8px;flex-wrap:wrap}

.e-stats b{font:700 17px var(--f-round);color:var(--ink)}
.e-card{background:#fff;border-radius:26px;padding:22px;border:1px solid var(--e-line);box-shadow:0 2px 0 rgba(21,22,29,.04),0 16px 30px -24px rgba(21,22,29,.35);display:flex;flex-direction:column;gap:14px;min-width:0}

.e-head h1{font:700 clamp(28px,3.4vw,38px)/1.1 var(--f-round);color:var(--ink)}
.e-head p{color:var(--text2);font-size:17px;font-weight:600;max-width:64ch}

.e-week{display:flex;justify-content:space-between;gap:6px}

.e-note{color:var(--text2);font-weight:600;font-size:15.5px}
.e-subj{display:grid;grid-template-columns:14px minmax(0,1fr) auto minmax(0,140px);gap:12px;align-items:center;font-size:16px}

.e-sdot{width:12px;height:12px;border-radius:50%}
.e-meter{display:flex;gap:4px}

.e-w{font:800 14.5px var(--f-friendly);text-align:right}
.e-tasks{display:flex;flex-direction:column;gap:10px}
.e-task{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:18px;background:var(--e-soft);cursor:pointer;border:2px solid transparent;transition:background .2s,border-color .2s}
.e-task input{width:24px;height:24px;accent-color:var(--teal);flex:none}

.e-task > span:last-child{display:flex;flex-direction:column;min-width:0}

.e-chat{display:flex;flex-direction:column;background:#fff;border:1px solid var(--e-line);border-radius:28px;overflow:hidden;max-width:780px;width:100%;margin:0 auto}
.e-chath{display:flex;gap:12px;align-items:center;padding:14px 18px;background:#0F6E64;color:#fff}
.e-chath .e-av{width:46px;height:46px;font-size:16px;background:#E9A23B}
.e-chath > div{display:flex;flex-direction:column;min-width:0}
.e-chath b{font:600 19px var(--f-round)}
.e-chath span{font-size:13.5px;opacity:.88;font-weight:600}
.e-chatb{display:flex;flex-direction:column;gap:10px;padding:18px;background:#F3EEE4;min-height:320px;max-height:520px;overflow-y:auto}
.e-b{max-width:80%;align-self:flex-start;background:#fff;border-radius:18px 18px 18px 6px;padding:10px 14px;box-shadow:0 1px 1px rgba(21,22,29,.07);display:flex;flex-direction:column;gap:2px;font-size:15.5px;line-height:1.45}
.e-card .e-b{background:var(--e-soft);max-width:100%;box-shadow:none}
.e-b.me{align-self:flex-end;background:#D9F4E3;border-radius:18px 18px 6px 18px}
.e-b small{align-self:flex-end;font-size:11.5px;color:var(--muted);font-weight:700}
.e-ann{align-self:center;display:flex;gap:8px;align-items:flex-start;background:#FFF0C7;color:#6E4E00;border-radius:14px;padding:9px 14px;font-weight:700;font-size:14px;max-width:92%}
.e-ann svg{flex:none;margin-top:2px}
.e-quick{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px 0}
.e-quick button{border:1.5px solid #BFE3D6;background:#EEF9F4;color:#0B5E54;border-radius:999px;padding:8px 14px;font:800 14px var(--f-friendly)}

.e-chatin input{flex:1;min-width:0;border:2px solid var(--e-line);border-radius:999px;padding:12px 16px;font:700 15.5px var(--f-friendly);color:var(--text);background:#fff}
.e-chatin .btn{border-radius:999px;width:50px;padding:0}

/* dirección */
.e-mark{width:76px;height:76px;border-radius:24px;background:#fff;display:grid;place-items:center;flex:none;overflow:hidden;box-shadow:0 2px 0 rgba(21,22,29,.06)}
.e-hero .btn-lg{align-self:center}
.e-big4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.e-num{background:#fff;border:1px solid var(--e-line);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.e-nl{font:800 14.5px var(--f-friendly);color:var(--text2);margin-top:6px}
.e-num b{font:700 32px/1.1 var(--f-round);color:var(--ink)}
.e-nd{font-size:13.5px;color:var(--muted);font-weight:700}
.e-item{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:18px;background:var(--e-soft);flex-wrap:wrap}
.e-item > div{flex:1;min-width:170px;display:flex;flex-direction:column}
.e-item b{font:800 15.5px var(--f-friendly)}
.e-item > div > span{font-size:14px;color:var(--text2);font-weight:600}
.e-gr{min-width:56px;height:46px;padding:0 10px;border-radius:14px;background:var(--ink);color:var(--amber);display:grid;place-items:center;font:700 17px var(--f-round);flex:none}
.e-gr.red{background:#FBE1DC;color:#9E2A1F}
.e-gr.ok{background:#DDF1E4;color:#1F6B41}
.e-groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.e-group{background:#fff;border:1px solid var(--e-line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:8px}
.e-gtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.e-group > b{font:800 16px var(--f-friendly)}
.e-gstats{display:flex;gap:12px;flex-wrap:wrap;font-size:13.5px;color:var(--text2);font-weight:700}
.e-gstats b{color:var(--ink);font:700 17px var(--f-round)}

/* welcome card that points to the guided demo */
.welcome{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:linear-gradient(120deg,#FFF1D2,#FDE3B0);border:1px solid #F1D08E;border-radius:22px;padding:14px 18px;margin-bottom:18px;animation:rise .4s cubic-bezier(.2,.7,.2,1)}

/* ---------- v5: white + purple look. Purple = brand and buttons; gold stays only for rewards (stars, XP, cofres) ---------- */
:root{--accent:#6D4AE0;--accent-ink:#4E2FC4;--accent-soft:#F0EBFF;--accent-line:#DCD2FF;
  --paper:#FFFFFF;--work:#FBFAFF;--card:#FFFFFF;--card2:#F8F6FE;--line:#E7E2F6;--line2:#F1EEFB;--text:#1C1A2B;--text2:#4B4865;--muted:#6E6A86}
body{background:#fff}
.top{background:rgba(255,255,255,.94)}
.mark{background:linear-gradient(135deg,#8366FF,#5534D6);color:#fff}
.roles{background:#fff;border-color:var(--line)}
.roles button[aria-pressed="true"]{background:var(--accent);color:#fff}
.modeseg{background:#fff}
.modeseg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.shell{background:var(--work);border-color:var(--line);box-shadow:0 1px 2px rgba(40,24,110,.05),0 24px 50px -34px rgba(40,24,110,.35)}
.main{background:linear-gradient(180deg,#FFFFFF 0,var(--work) 360px)}
.side{background:#fff;color:var(--text);border-right:1px solid var(--line)}
.who .av{background:var(--accent-soft)}
.who span{color:var(--muted)}
.nav button{color:var(--text2)}
.nav button:hover{background:var(--accent-soft);color:var(--text)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink)}
.side-tip{border-color:var(--line);color:var(--text2);background:var(--card2)}
.side-tip b{color:var(--accent-ink)}
.eyebrow{color:var(--accent-ink)}
.btn-amber{background:var(--accent);color:#fff}
.btn-amber:hover{box-shadow:0 8px 20px -10px rgba(109,74,224,.9)}
.btn-ink{background:#1C1A2B}
.card{border-color:var(--line);box-shadow:0 1px 2px rgba(40,24,110,.04),0 12px 30px -22px rgba(40,24,110,.3)}
.hero-s{background:linear-gradient(130deg,#2E1F7A 0%,#5B3BD8 100%)}
.hero-s::before{background:radial-gradient(circle,rgba(255,210,120,.28),rgba(255,210,120,0) 70%)}
.hudbar{background:linear-gradient(120deg,#271B66,#4A2FB8)}
.hoy-hero{background:linear-gradient(125deg,#2A1C70 0%,#4C30C0 60%,#6D4AE0 100%)}

.tourbar{background:linear-gradient(120deg,#271B66 0%,#5B3BD8 100%)}
.tb-ctl .tgo{background:#fff;border-color:#fff;color:var(--accent-ink)}
.tb-ctl .tgo:hover{background:#F0EBFF!important}
.tb-k{color:#FFD98A}
.tour-hl{outline-color:var(--accent)!important}
@keyframes hlp{50%{outline-color:rgba(109,74,224,.3)}}
.welcome{background:linear-gradient(120deg,#F3EEFF,#E7DEFF);border-color:var(--accent-line)}
.cc-ic{background:var(--accent-soft);color:var(--accent-ink)}
.dir-hero{background:linear-gradient(120deg,#F3EEFF,#FFFFFF);border-color:var(--accent-line)}
.link-acad{background:var(--accent-soft);color:#3B2A8F}
.toast{background:#1C1A2B}
.toast span{color:#B9A6FF!important}
.iconbtn{background:#fff;border-color:var(--line)}
th{background:var(--card2)}
/* Modo escuela in the same white + purple */
body.school{--e-bg:#FBFAFF;--e-line:#E9E3FA;--e-soft:#F7F4FF;--e-sky:#EEE8FF;--e-sun:#FFFFFF;--e-mint:#E6F7EF;--e-lilac:#EFE9FF}

/* start screen: choose how to enter */
.start{position:fixed;inset:0;z-index:70;overflow-y:auto;background:radial-gradient(120% 80% at 50% 0%,#F1ECFF 0%,#FFFFFF 60%);display:flex;justify-content:center;align-items:flex-start;padding:max(28px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px))}
.start[hidden]{display:none}
.st-card{width:min(720px,100%);margin:auto 0;background:#fff;border:1px solid var(--line);border-radius:30px;box-shadow:0 30px 70px -40px rgba(40,24,110,.45);padding:30px;display:flex;flex-direction:column;gap:18px;animation:rise .45s cubic-bezier(.2,.7,.2,1)}
.st-brand{display:flex;align-items:center;gap:12px}
.st-brand .mark{width:46px;height:46px;border-radius:14px;font-size:19px}

.st-brand span{font-size:13px;color:var(--muted);font-weight:600}
.st-card h1{font:800 clamp(28px,4vw,40px)/1.08 var(--f-display);letter-spacing:-.02em;color:var(--text);text-wrap:balance}
.st-card > p{color:var(--text2);font-size:16px;margin-top:-8px}
.st-roles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.st-role{border:2px solid var(--line);background:#fff;border-radius:22px;padding:16px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;transition:transform .15s,border-color .2s,background .2s}
.st-role:hover{transform:translateY(-3px);border-color:var(--accent-line)}
.st-role[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.st-ic{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;color:#fff;background:var(--c)}
.st-ic.owl{background:var(--accent-soft)}
.st-role b{font:700 16px var(--f-display);color:var(--text)}
.st-role > span:last-child{font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.3}
.st-form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.st-form label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--text2)}
.st-form input{font:600 15px var(--f-body);color:var(--text);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;background:var(--card2);width:100%}
