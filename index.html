.st-alt{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.st-alt button{border:0;background:none;color:var(--accent-ink);font-weight:700;font-size:14px;display:inline-flex;gap:6px;align-items:center;padding:6px 8px;border-radius:10px}
.st-alt button:hover{background:var(--accent-soft)}
.st-note{text-align:center;font-size:12.5px;color:var(--muted)}
@media (max-width:640px){.st-card{padding:20px;border-radius:24px}.st-roles{grid-template-columns:repeat(2,minmax(0,1fr))}.st-form{grid-template-columns:1fr}}

/* ---------- v6: each module stands alone (module bar + Salir), navigation that never gets covered,
   teacher module in the style of the reference screens: navy bar, emoji navigation, pastel tool buttons, colored alert rows ---------- */
:root{--navy:#1A237E;--indigo:#283593;--top-h:64px;
  --f-display:'Nunito','Trebuchet MS',system-ui,sans-serif;--f-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --work:#F4F3FD;--line:#E6E4F3;--line2:#EFEEF8;--text:#20244A;--text2:#4D5175;--muted:#71738F;
  --t-blue:#E3F2FD;--t-mint:#E0F2F1;--t-lav:#EDE7F6}
body{padding:0;background:var(--work)}
:focus-visible{outline-color:var(--accent)}

/* module bar: brand, the module you are in, and Salir. No other roles here. */
.top{position:sticky;top:0;z-index:40;flex-wrap:nowrap;gap:12px;min-height:58px;
  padding:calc(9px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 9px max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(90deg,#1A237E 0%,#24308E 60%,#2D3A9C 100%);color:#fff;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:0 8px 22px -16px rgba(26,35,126,.9)}
.top #roles,.top #tourBtn,.top #modeSeg,.top .demo-chip{display:none!important}
.top :focus-visible{outline-color:#fff}
.top .brand{flex:none;gap:10px}
.top .mark{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff}
.top .brand > b{color:#fff;font:800 16px var(--f-display);letter-spacing:0;opacity:.9}
.modt{display:flex;align-items:center;gap:10px;min-width:0;padding-left:14px;border-left:1px solid rgba(255,255,255,.22)}
.modt-ic{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:22px;line-height:1;flex:none}
.modt-t{display:flex;flex-direction:column;min-width:0;line-height:1.15;overflow:hidden}
.modt-t b{font:800 20px var(--f-display);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modt-t span{font-size:12.5px;font-weight:700;color:rgba(255,255,255,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .top-act{margin-left:auto;flex-wrap:nowrap;gap:8px}
.top .iconbtn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.26);color:#fff}
.top .iconbtn:hover{background:rgba(255,255,255,.22)}
.top .iconbtn[aria-pressed="false"]{color:rgba(255,255,255,.6)}
.top #brandBtn{order:1}.top #sndBtn{order:2}
.top #homeBtn{order:3;width:auto;padding:0 15px 0 11px;gap:6px;display:inline-flex;align-items:center;font:800 15px var(--f-body);background:rgba(255,255,255,.18)}
.top #homeBtn:hover{background:rgba(255,255,255,.28)}
.top .cobrand{border:1px solid rgba(255,255,255,.3)}
.top.cb .modt-t span{display:none}

/* full-bleed app: white sidebar that stays put, soft lavender workspace */
.shell{border:0;border-radius:0;box-shadow:none;background:var(--work);min-height:calc(100vh - var(--top-h));grid-template-columns:252px minmax(0,1fr)}
.main{background:linear-gradient(180deg,#EDF1FD 0,#F3F1FC 440px,#F5F3FC 100%);padding:26px clamp(18px,2.6vw,36px) 44px}
body:not(.school) .side{position:sticky;top:var(--top-h);align-self:start;height:calc(100vh - var(--top-h));overflow-y:auto;overscroll-behavior:contain;
  background:#fff;color:var(--text);border-right:1px solid var(--line);padding:18px 14px 16px max(14px,env(safe-area-inset-left,0px));gap:14px;scrollbar-width:thin}
@supports (height:100dvh){body:not(.school) .side{height:calc(100dvh - var(--top-h))}}
.who{padding:2px 8px 12px;border-bottom:1px solid var(--line2)}
.who b{font:800 15px var(--f-body);color:var(--navy)}
.nav{gap:3px}
.nav-sec{font:800 11px var(--f-body);letter-spacing:.17em;text-transform:uppercase;color:#A3A5BD;padding:12px 12px 4px}
.nav-sec:first-child{padding-top:0}
.nav button{gap:12px;padding:10px 12px;border-radius:14px;font:700 15px/1.25 var(--f-body);color:#454A75;white-space:normal}
.nav .ne{font-size:21px;line-height:1;width:28px;text-align:center;flex:none}
.nav .nl{min-width:0}
.nav button:hover{background:#F2F1FB;color:var(--navy)}
.nav button[aria-current="page"]{background:linear-gradient(90deg,#E8EAF6,#EDE7F6);color:var(--navy)}
.nav button.hot{background:#FFF1EC}
.nav button.hot[aria-current="page"]{background:linear-gradient(90deg,#FFE5DA,#FFEFE8)}
.nav .badge{margin-left:auto;min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:#FF7043;color:#fff;font:800 12px/24px var(--f-body);text-align:center;flex:none}
.side-tip{background:#F7F6FD;border-color:#ECEAF7;color:var(--text2)}
.side-tip b{font:800 11px var(--f-body);letter-spacing:.14em;color:#6A55D6}
.foot-note{margin:0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));background:var(--work);border-top:1px solid var(--line)}
.toast{pointer-events:none}

/* type and surfaces closer to the reference: rounded type, navy titles, softer labels */
.h1{font-weight:800;color:var(--navy);letter-spacing:-.015em}
.h2{font-weight:800;color:var(--navy);letter-spacing:-.005em}
.eyebrow{font:800 11.5px var(--f-body);letter-spacing:.13em;color:#6A55D6}
.sig-k{font:800 11px var(--f-body);letter-spacing:.13em;color:#8A8CA6}
.card{border-radius:24px;border-color:#ECEAF7;box-shadow:0 1px 3px rgba(26,35,126,.05),0 16px 36px -26px rgba(26,35,126,.38)}
.hoy-hero{background:linear-gradient(120deg,#1D2381 0%,#2F2A95 55%,#4A2FA3 100%)}
.hoy-hero::before{background:radial-gradient(circle,rgba(171,71,188,.45),rgba(171,71,188,0) 70%)}
.hoy-hero .eyebrow,.ghero .eyebrow{color:#FFD98A}
.tourbar{background:linear-gradient(120deg,#1A237E 0%,#3A2A9C 100%)}
.sig{background:var(--sbg,var(--card));border-color:#ECEAF7}
.cc-e{font-size:24px;line-height:1}
.mission .ic-e{background:#F1F0FB;font-size:20px;line-height:1}
.ask-in input{font-size:16px}

/* page title with a soft rule, like the reference */
.ptitle{display:flex;align-items:center;gap:14px}
.ptitle .h1{display:flex;align-items:center;gap:10px;white-space:nowrap}
.ptitle::after{content:"";flex:1;height:3px;border-radius:9px;background:linear-gradient(90deg,#4FC3F7,rgba(79,195,247,0))}
.psub{margin-top:-8px}

/* gradient hero for Copiloto and Alerta temprana */
.ghero{position:relative;overflow:hidden;display:flex;gap:18px;align-items:center;padding:26px 28px;border-radius:26px;color:#fff;background:linear-gradient(120deg,#1D2381 0%,#33289A 55%,#4A2FA3 100%);box-shadow:0 20px 40px -28px rgba(26,35,126,.9)}
.ghero::after{content:"";position:absolute;right:-90px;top:-130px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(171,71,188,.42),rgba(171,71,188,0) 70%)}
.ghero > *{position:relative;z-index:1}
.gh-e{font-size:46px;line-height:1;flex:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.ghero h1{font:800 clamp(24px,3vw,32px)/1.12 var(--f-display);letter-spacing:-.01em;margin-top:4px;text-wrap:balance}
.ghero p{color:rgba(255,255,255,.82);font-size:15.5px;max-width:70ch;margin-top:6px}

/* copilot: two toolboxes + ask anything */
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.tool-list{display:flex;flex-direction:column;gap:10px}
.tool-b{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-radius:16px;padding:14px 16px;font:800 15.5px/1.25 var(--f-body);color:var(--navy);background:var(--t-blue);transition:transform .15s,background .2s,box-shadow .2s}
.tool-b .te{font-size:22px;line-height:1;flex:none}
.tool-b:hover{transform:translateY(-1px);background:#D5EAFC;box-shadow:0 8px 18px -14px rgba(26,35,126,.6)}
.tool-c.care .tool-b{background:var(--t-mint)}
.tool-c.care .tool-b:hover{background:#CDEAE6}
.tool-b[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--navy)}
.tool-topic{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px;font-weight:800;color:var(--text2)}
.tool-topic select{font:800 15px var(--f-body);color:var(--navy);border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff;max-width:100%}
.askbox{display:flex;gap:10px}
.askbox input{flex:1;min-width:0;font:600 16px var(--f-body);color:var(--text);border:2px solid #ECEAF5;border-radius:16px;padding:13px 16px;background:#FCFCFE}
.askbox input:focus{border-color:#B39DDB;outline:none}
.btn-send{border:0;border-radius:16px;padding:0 26px;font:800 16px var(--f-body);color:#fff;background:linear-gradient(135deg,#6D4AE0,#9C4DCC);box-shadow:0 10px 20px -14px rgba(109,74,224,.9)}
.btn-send:hover{filter:brightness(1.06)}
.qchips{display:flex;gap:8px;flex-wrap:wrap}
.qchips button{border:0;background:var(--t-lav);color:#4527A0;border-radius:999px;padding:8px 14px;font:800 14px var(--f-body);transition:background .2s}
.qchips button:hover{background:#E1D7F3}
#cOut{scroll-margin-top:calc(var(--top-h) + 16px)}
.copilot-out{border-radius:24px;border-color:#ECEAF7;box-shadow:0 1px 3px rgba(26,35,126,.05),0 16px 36px -26px rgba(26,35,126,.38);min-height:300px}
.copilot-out h4{color:var(--navy);font-weight:800;font-size:20px}
.copilot-out h5{font:800 12px var(--f-body);letter-spacing:.12em;color:#00897B}
.cop-empty{display:grid;place-items:center;text-align:center;flex:1;gap:8px;color:var(--muted);padding:30px 10px}
.cop-empty > span:first-child{font-size:40px;line-height:1}
.cop-empty b{font:800 19px var(--f-display);color:var(--navy)}
.cop-wait{display:flex;gap:8px;align-items:center;color:var(--muted);font-weight:700}
.cop-wait span{color:var(--accent);display:grid}
.cop-acts{margin-top:8px}

/* alert rows with a colored edge, like the reference list */
.alist{display:flex;flex-direction:column;gap:12px}
.arow{border-radius:18px;background:var(--abg);box-shadow:inset 6px 0 0 var(--ac);overflow:hidden}
.arow-h{display:flex;align-items:center;gap:14px;width:100%;border:0;background:transparent;text-align:left;padding:16px 18px 16px 22px;color:inherit;font:inherit}
button.arow-h:hover{background:rgba(26,35,126,.03)}
.arow-e{font-size:26px;line-height:1;flex:none;width:34px;text-align:center}
.arow-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.arow-t b{font:800 16.5px/1.3 var(--f-body);color:var(--navy)}
.arow-t > span{font-size:14.5px;color:#5E6283;line-height:1.4}
.arow-m{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.arow-w{font-size:13px;color:#9597B1;font-weight:700;white-space:nowrap}
.arow-chev{flex:none;color:#9597B1;transition:transform .2s;display:grid}
.arow.open .arow-chev{transform:rotate(90deg)}
.arow-b{display:none;padding:0 18px 18px 70px;flex-direction:column;gap:12px}
.arow.open .arow-b{display:flex}
.arow-do{display:flex;margin-top:6px}
@media (max-width:1000px){.hoy-hero{grid-template-columns:minmax(0,1fr);padding:24px}.hh-sem{gap:8px}.hh-dot{width:auto;flex:1}}
.acol{display:flex;flex-direction:column;gap:16px;min-width:0}
.tcall{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-radius:20px;padding:14px 18px 14px 22px;background:linear-gradient(90deg,#FFF1EC,#FFF8F5);box-shadow:inset 6px 0 0 #FF7043;color:var(--navy);font:inherit}
.tcall:hover{background:linear-gradient(90deg,#FFE7DE,#FFF1EC)}
.tcall-e{font-size:28px;line-height:1;flex:none}
.tcall > span:nth-child(2){flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tcall b{font:800 16px var(--f-body)}
.tcall span span{font-size:14.5px;color:#5E6283}
.tcall > svg{flex:none;color:#E64A19}

/* alerta temprana */
.clin{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;padding:16px 20px 16px 24px;border-radius:20px;background:linear-gradient(90deg,#ECEBF8,#F3F1FC);box-shadow:inset 6px 0 0 #5C6BC0}
.clin-ic{font-size:30px;line-height:1;flex:none}
.clin > div{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:2px}
.clin b{font:800 16px var(--f-body);color:var(--navy)}
.clin span{font-size:14px;color:#5E6283}
.pill-ok{flex:none;background:#5C6BC0;color:#fff!important;font:800 13px var(--f-body)!important;padding:7px 14px;border-radius:999px;white-space:nowrap}
.ecase{border:2px solid #FF8A65;border-radius:26px;background:#fff;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 16px 36px -28px rgba(230,74,25,.6)}
.ecase-top{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.ecase-h{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.ewarn{color:#D84315;font-weight:800;font-size:15px;display:flex;gap:6px;align-items:center}
.enote{background:#FFF5F3;border-radius:16px;padding:16px 18px;font-size:15.5px;line-height:1.55;color:#3F4366}
.enote b{color:var(--navy)}
.etitle{font:800 14.5px var(--f-body);color:#4D5175;display:flex;gap:8px;align-items:center}
.etc{min-height:250px}
.etc svg{display:block;overflow:visible}
.etc text{font:700 11.5px var(--f-body);fill:#8A8CA6}
.etc .et-band{font:800 12px var(--f-body);fill:#D84315}
.etc .et-lab{font:800 12.5px var(--f-body);fill:#3F4366}
.etc .et-end{font:800 13px var(--f-body);fill:#20244A}
.et-leg .ln{display:inline-block;width:24px;height:0;border-top:3px solid #1E9E8F;border-radius:2px}
.et-leg .ln.dash{border-top:3px dashed #F4511E}
.et-leg .bx{display:inline-block;width:16px;height:12px;border-radius:4px;background:#FFF3E6;border:1px solid #FFD7B0}
.et-data summary{cursor:pointer;font-weight:800;color:var(--accent-ink);font-size:14px;width:fit-content}
.et-data .tablewrap{margin-top:8px;max-width:420px}
.egrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.ewhy p{font-size:15.5px;line-height:1.6;color:#4D5175}
.ewhy b{color:var(--navy)}
.eact{background:linear-gradient(180deg,#E4F4EC,#ECF7F2);border-color:#D2ECDF}
.eact ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;font-size:15.5px;color:#36405F}
.ebig{font:800 16px/1.4 var(--f-body);color:#00695C}
.btn-teal{background:linear-gradient(135deg,#00695C,#26A69A);color:#fff;border:0}
.btn-teal:hover{box-shadow:0 8px 20px -10px rgba(0,105,92,.9)}
.obs{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:#F8F7FD;flex-wrap:wrap}
.obs-e{font-size:24px;line-height:1;flex:none}
.obs > div{flex:1;min-width:180px;display:flex;flex-direction:column;gap:2px}
.obs b{font:800 15.5px var(--f-body);color:var(--navy)}
.obs > div span{font-size:14px;color:#5E6283}

/* start screen: choose the version here instead of inside the modules */
.st-mode{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;font-size:14px;font-weight:800;color:var(--text2)}
.st-mode button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 15px;font:800 14px var(--f-body);color:var(--text2);transition:background .2s,border-color .2s}
.st-mode button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.st-mode em{flex-basis:100%;text-align:center;font-style:normal;font-size:12.5px;color:var(--muted);font-weight:600}
.st-note b{color:var(--accent-ink)}

/* guided tour bar sits under the module bar; school-mode tabs stay reachable */
@media (min-width:761px){body:not(.school) .tourbar{position:sticky;top:calc(var(--top-h) + 10px)}}
.school .tourbar{position:relative;top:auto}
@media (min-width:901px){.school .side{position:sticky;top:var(--top-h);z-index:30;padding:12px 20px;background:rgba(251,250,255,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--e-line)}}

@media (max-width:1100px){.tools{gap:14px}}
@media (max-width:900px){.top .brand > b{display:none}}
/* iPad portrait: keep the sidebar like the reference instead of a strip under the header */
@media (min-width:761px) and (max-width:900px){
  body:not(.school) .shell{grid-template-columns:212px minmax(0,1fr)}
  body:not(.school) .side{padding:16px 10px 14px max(10px,env(safe-area-inset-left,0px));gap:10px}
  body:not(.school) .who{display:flex}
  body:not(.school) .side-tip{display:none}
  body:not(.school) .nav{flex-direction:column;overflow:visible}
  .nav button{font-size:14.5px;padding:9px 10px;gap:10px}
  .nav .ne{font-size:20px;width:24px}
  .main{padding:22px 18px 36px}
}
/* phones: one row of sections that stays under the module bar */
@media (max-width:760px){
  body:not(.school) .shell{grid-template-columns:minmax(0,1fr)}
  body:not(.school) .side{height:auto;overflow:visible;z-index:30;padding:8px max(10px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--line);background:rgba(255,255,255,.97);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);gap:0}
  body:not(.school) .who,body:not(.school) .side-tip,.nav-sec{display:none}
  body:not(.school) .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none}
  body:not(.school) .nav::-webkit-scrollbar{display:none}
  .nav button{white-space:nowrap;padding:8px 12px;font-size:14px;gap:8px;flex:none}
  .nav .ne{font-size:18px;width:auto}
  .main{padding:18px 14px 32px}
}
@media (max-width:640px){
  .top{position:sticky;gap:8px}
  .modt{padding-left:10px}
  .modt-ic{width:34px;height:34px;font-size:19px;border-radius:10px}
  .modt-t b{font-size:17px}
  .modt-t span,.top .cobrand{display:none}
  .top #homeBtn{padding:0 12px 0 9px}
  .ghero{flex-direction:column;align-items:flex-start;padding:20px;gap:10px}
  .gh-e{font-size:38px}
  .tools,.egrid{grid-template-columns:minmax(0,1fr)}
  .askbox{flex-direction:column}
  .btn-send{padding:13px}
  .clin{align-items:flex-start;padding:14px 16px 14px 20px}
  .clin > div{flex-basis:calc(100% - 50px)}
  .st-mode > span{flex-basis:100%;text-align:center}
  .arow-h{padding:14px 14px 14px 18px;gap:10px}
  .arow-e{font-size:22px;width:26px}
  .arow-m .sig-lvl{display:none}
  .arow-b{padding:0 14px 16px 18px}
  .ecase{padding:16px}
  .ptitle .h1{white-space:normal}
}
@media (max-width:400px){.top #brandBtn{display:none}}

/* ---------- v7: Lumi, floating companion in every module ---------- */
.main{padding-bottom:96px}
.lumi-fab{position:fixed;z-index:45;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:5px 18px 5px 5px;background:linear-gradient(135deg,#6D4AE0,#9C4DCC);color:#fff;font:800 15px var(--f-body);box-shadow:0 14px 30px -12px rgba(76,48,192,.75);transition:transform .2s}
.lumi-fab:hover{transform:translateY(-2px)}
.lf-av{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none}
.lumi-fab{padding:5px}.lf-t{display:none;padding-right:12px}.lumi-fab:hover .lf-t{display:inline}.lumi-fab.on .lf-t{display:none}
.lumi-panel{position:fixed;z-index:55;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(390px,calc(100vw - 32px));max-height:min(620px,calc(100vh - var(--top-h) - 110px));display:flex;flex-direction:column;background:#fff;border:1px solid #E6E4F3;border-radius:24px;box-shadow:0 30px 60px -24px rgba(26,35,126,.55);overflow:hidden;animation:rise .3s cubic-bezier(.2,.7,.2,1)}
.lumi-panel[hidden]{display:none}
.lp-h{display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(120deg,#1D2381,#4A2FA3);color:#fff}
.lp-av{width:44px;height:44px;border-radius:14px;background:#fff;display:grid;place-items:center;flex:none;overflow:hidden}
.lp-h > div{flex:1;min-width:0;display:flex;flex-direction:column}
.lp-h b{font:800 18px var(--f-display)}
.lp-h span{font-size:13px;color:rgba(255,255,255,.78);font-weight:700}
.lp-h .x{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);color:#fff}
.lp-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:#F7F6FD;min-height:150px}
.lm{display:flex;gap:8px;align-items:flex-end;max-width:92%}
.lm-av{width:30px;height:30px;flex:none}
.lm > div{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.lm p{background:#fff;border:1px solid #ECEAF7;border-radius:16px 16px 16px 4px;padding:9px 12px;font-size:14.5px;line-height:1.45;color:var(--text)}
.lm.me{align-self:flex-end}
.lm.me p{background:var(--accent);color:#fff;border-color:var(--accent);border-radius:16px 16px 4px 16px}
.lm-go{border:0;background:var(--t-lav);color:#4527A0;border-radius:999px;padding:7px 12px;font:800 13.5px var(--f-body)}
.lm-dots{display:flex;gap:4px}.lm-dots i{width:7px;height:7px;border-radius:50%;background:#B3A6E8;animation:blink 1s infinite}.lm-dots i:nth-child(2){animation-delay:.2s}.lm-dots i:nth-child(3){animation-delay:.4s}
.lp-chips{display:flex;gap:6px;overflow-x:auto;padding:10px 12px 0;scrollbar-width:none}
.lp-chips button{flex:none;border:1px solid #E1D7F3;background:#fff;color:#4527A0;border-radius:999px;padding:7px 12px;font:800 13px var(--f-body)}
.lp-in{display:flex;gap:8px;padding:10px 12px}
.lp-in input{flex:1;min-width:0;font:600 16px var(--f-body);border:2px solid #ECEAF5;border-radius:14px;padding:10px 12px;color:var(--text)}
.lp-in input:focus{outline:none;border-color:#B39DDB}
.lp-in button{width:46px;border:0;border-radius:14px;background:linear-gradient(135deg,#6D4AE0,#9C4DCC);color:#fff;display:grid;place-items:center;flex:none}
.lp-note{font-size:11.5px;color:var(--muted);padding:0 14px 12px;line-height:1.35}
@media (max-width:900px){.school .lumi-fab{bottom:calc(92px + env(safe-area-inset-bottom,0px))}.school .lumi-panel{bottom:calc(160px + env(safe-area-inset-bottom,0px))}}
@media (max-width:760px){.lf-t{display:none}.lumi-fab{padding:5px}
  .lumi-panel{left:8px;right:8px;width:auto;bottom:calc(80px + env(safe-area-inset-bottom,0px));max-height:calc(100vh - var(--top-h) - 100px)}}

/* ---------- v8: why-step, reading with a magnifier, weekly CASEL, adaptation card ---------- */
.why{display:grid;gap:10px}
.why button{text-align:left;border:0;border-radius:16px;padding:14px 16px;font:800 16px/1.3 var(--f-body);color:var(--ink);background:#F7F2E9;box-shadow:0 5px 0 #BDB2A0;transition:transform .12s}
.why button:hover:not(:disabled){transform:translateY(-2px)}
.why button.right{background:#BDEBD2;box-shadow:0 5px 0 #6FBF95}
.why button.wrong{background:#F8C9C1;box-shadow:0 5px 0 #D98A7E}
.why button:disabled:not(.right):not(.wrong){opacity:.55}
.lr-cover{font-size:54px;text-align:center;letter-spacing:8px}
.lr-text{background:#FFFBF2;color:#2A2433;border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;font-size:17px;line-height:1.6}
.lr-p{position:relative;padding-right:22px;border-radius:10px;transition:background .3s}
.lr-p.cur{background:#FFF0C7;box-shadow:0 0 0 6px #FFF0C7}
.lr-p.flash{animation:lrf 1.4s}
@keyframes lrf{40%{background:#FFE08A;box-shadow:0 0 0 6px #FFE08A}}
.lr-dot{position:absolute;right:0;top:6px;width:12px;height:12px;border-radius:50%}
.lr-dot.verde{background:#2E9B63}.lr-dot.amarillo{background:#E3A21A}.lr-dot.rojo{background:#D2412F}
.lr-g{color:#9A3A12;border-bottom:2px dotted #E2672E;cursor:help}
.lr-s.pick{cursor:pointer;border-radius:6px;transition:background .2s}
.lr-s.pick:hover{background:#E8E2FF}
.lr-s.ok{background:#BDEBD2}.lr-s.no{background:#F8C9C1}.lr-s.hint{background:#E8E2FF}
.lights{display:flex;gap:10px;flex-wrap:wrap}

/* battle: scene and question side by side when there is room, so the question is always visible */
.bgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}

/* canvases fill their box at any pixel density (on iPad and retina screens the bitmap is 2x and was shown zoomed in) */
.stage canvas,.mapwrap canvas{width:100%;height:100%}
/* what happened after answering, shown on the scene itself */
.bres{position:absolute;left:50%;top:16%;z-index:3;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 18px;border-radius:16px;background:rgba(20,22,41,.8);color:#fff;text-align:center;pointer-events:none;white-space:nowrap;animation:bresIn 2s ease forwards;box-shadow:0 10px 24px -12px rgba(0,0,0,.7)}

@media (prefers-reduced-motion:reduce){.bres{animation:none;transform:translateX(-50%)}}

/* v9 · Tiempo para tus alumnos */

.pj-medal{align-self:center;animation:starpop .7s cubic-bezier(.3,1.6,.5,1) both}
.pj-next{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.pj-next .quest{cursor:default}
.pj-next .quest:hover{transform:none;box-shadow:none}
.pj-next .quest .dimstrip{margin-top:8px;height:6px}
.pj-next .quest.locked .art{filter:saturate(.55) brightness(.8)}
.pj-next .quest .lockt{display:inline-flex;align-items:center;gap:5px;font:700 12px var(--f-body);color:var(--on-ink2);margin-top:4px}
.pj-banner{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center;padding:16px 20px 16px 16px;border-radius:24px;color:#fff;background:linear-gradient(120deg,var(--garden) 0%,var(--garden2) 60%,var(--garden3) 100%);box-shadow:0 18px 36px -28px rgba(14,94,82,.95)}
.pj-banner .pb-art{width:132px;line-height:0}
.pj-banner .pb-art svg{width:100%;height:auto;display:block;border-radius:16px}
.pj-banner .eyebrow{color:#FFD98A}
.pj-banner h2{font:800 22px var(--f-display);color:#fff;margin-top:2px}
.pj-banner p{color:rgba(255,255,255,.86);font-size:14.5px;margin-top:2px}
.pj-banner .dimstrip{margin-top:10px;max-width:280px}
.pj-banner .pb-go{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.pj-banner .pb-team{display:flex}
.pj-banner .pb-team span{width:38px;height:38px;border-radius:50%;overflow:hidden;background:#E3DAFF;border:2px solid #fff;margin-left:-10px;line-height:0}
.pj-banner .pb-team span:first-child{margin-left:0}
.pj-banner .btn{background:#fff;color:var(--garden)}

/* teacher · Proyectos + correlación */
.pj-ghero{background:linear-gradient(120deg,#0B4F46 0%,#13786A 55%,#239E86 100%);box-shadow:0 20px 40px -28px rgba(11,79,70,.95)}
.pj-ghero::after{background:radial-gradient(circle,rgba(255,217,138,.32),rgba(255,217,138,0) 70%)}
.pj-ghero .dchips{margin-top:14px}
.pj-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.pj-kpi{background:#fff;border:1px solid #ECEAF7;border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;box-shadow:0 1px 3px rgba(26,35,126,.05)}
.pj-kpi b{font:800 26px var(--f-display);color:var(--navy)}
.pj-kpi span{font-size:13.5px;color:var(--text2)}
.pj-kpi.warn{background:#FFFBF0;border-color:#F5E2B0}
.rmap{display:flex;flex-direction:column}
.rmap-r{display:grid;grid-template-columns:44px minmax(0,1.3fr) minmax(0,1.1fr) minmax(0,1.3fr) minmax(0,150px);gap:14px;align-items:center;padding:12px 4px;border-top:1px solid var(--line2)}
.rmap-r:first-child{border-top:0}
.rmap-r.hd{padding-top:0;font:800 11px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:#8A8CA6}
.rmap-e{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--dsoft,#F3F1FC)}
.rmap-r b{font:800 15px var(--f-body);color:var(--navy);display:block}
.rmap-r .small{display:block}
.rmap-p{display:flex;align-items:center;gap:8px;font:700 13px var(--f-body);color:var(--text2)}
.rmap-p .bar{flex:1}
.teams{display:flex;flex-direction:column;gap:10px}
.team{display:grid;grid-template-columns:minmax(0,1.25fr) auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px;border-radius:18px;background:#F8F7FD;border:1px solid transparent}
.team.hot{background:#FFFBF0;border-color:#F5E2B0}
.team.mine{background:#F3FBF8;border-color:#CDEBDF}
.tm-n{display:flex;flex-direction:column;gap:2px;min-width:0}
.tm-n b{font:800 15.5px var(--f-body);color:var(--navy)}
.tm-n span{font-size:13px;color:var(--text2)}
.tm-m{display:flex}
.tm-m span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:800 12px var(--f-body);color:var(--navy);background:#E8E4FA;border:2px solid #fff;margin-left:-8px}
.tm-m span:first-child{margin-left:0}
.tm-m span.iso{background:#FFE7E1;color:#9E2A1F}
.tm-p{display:flex;align-items:center;gap:10px;min-width:0}
.tm-dots{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px;flex:1;min-width:90px}
.tm-dots i{height:10px;border-radius:3px;background:#E6E3F3}
.tm-dots i.on{background:var(--dc)}
.tm-p .num{font:800 14px var(--f-body);color:var(--navy);white-space:nowrap}
.corr{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
.corr-t{display:grid;grid-template-columns:minmax(120px,1.5fr) repeat(3,minmax(0,1fr));gap:4px}
.corr-t .ch{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;font:800 13px var(--f-body);color:var(--navy);text-align:center;padding-bottom:4px}
.corr-t .ch span{font-size:18px}
.corr-t .rh{display:flex;flex-direction:column;justify-content:center;gap:1px;padding-right:6px;min-width:0}
.corr-t .rh b{font:800 14px/1.2 var(--f-body);color:var(--navy)}
.corr-t .rh span{font-size:12px;color:var(--muted)}
.corr-t .cc{border:0;border-radius:10px;min-height:52px;background:var(--cbg);color:var(--cfg);font:800 13.5px var(--f-body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:transform .15s,box-shadow .2s}
.corr-t .cc small{font:700 11px var(--f-mono);opacity:.85}
.corr-t .cc:hover,.corr-t .cc:focus-visible{transform:scale(1.04);box-shadow:0 8px 18px -10px rgba(46,31,122,.7)}
.corr-leg{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--text2);margin-top:10px}
.corr-leg span{display:inline-flex;gap:6px;align-items:center}
.corr-leg i{width:22px;height:12px;border-radius:4px;background:var(--cbg)}
.corr-ins{display:flex;flex-direction:column;gap:10px}
.cins{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;padding:12px 14px;border-radius:16px;background:#F8F7FD}
.cins .ci-e{font-size:22px;line-height:1.1;letter-spacing:-2px}
.cins b{display:block;font:800 15px var(--f-body);color:var(--navy)}
.cins p{font-size:14px;color:var(--text2);margin-top:2px}
.cins .btn{margin-top:8px}
.corr-note{font-size:13.5px;color:var(--text2);background:#F3F1FC;border-radius:12px;padding:10px 12px}

/* teacher · Sociograma */
.sg-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.sg-wrap{overflow-x:auto;border-radius:18px;background:linear-gradient(180deg,#FBFAFF,#F4F2FD);border:1px solid #ECEAF7}
.sg-svg{display:block;width:100%;min-width:480px;height:auto;touch-action:manipulation}
.sg-svg text{font-family:var(--f-body)}
.sg-hull{fill:#EFEBFF;stroke:#DDD5FB;stroke-width:1.5}
.sg-hl{font:800 12px var(--f-body);fill:#8A80BF;letter-spacing:.08em;text-transform:uppercase}
.sge{color:#C3BEDF;transition:opacity .25s,color .25s}
.sge line{stroke:currentColor;stroke-width:1.4}
.sge path{fill:currentColor}
.sge.mu{color:#9C8BE8}
.sge.mu line{stroke-width:3}
.sgn{cursor:pointer;transition:opacity .25s}
.sgn circle.b{fill:#FFFFFF;stroke:#7E66E4;stroke-width:2.2}
.sgn text.i{font:800 11.5px var(--f-body);fill:#20244A;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.sgn.lead circle.b{fill:#6D4AE0;stroke:#4E2FC4}
.sgn.lead text.i{fill:#fff}
.sgn.iso circle.b{fill:#FFF3F0;stroke:#D2412F;stroke-width:2.6;stroke-dasharray:4 3}
.sgn.iso text.i{fill:#9E2A1F}
.sgn .bdg{pointer-events:none}
.sgn:focus{outline:none}
.sgn:focus-visible circle.b,.sgn.sel circle.b{stroke:#FFB300;stroke-width:4;stroke-dasharray:none}
.sgl{font:800 11px var(--f-body);fill:#20244A;text-anchor:middle;paint-order:stroke;stroke:#F7F5FF;stroke-width:4px;stroke-linejoin:round;display:none;pointer-events:none}
.sgn.iso .sgl,.sgn.lead .sgl{display:block}
.sg-svg.has-sel .sgn .sgl{display:none}
.sg-svg.has-sel .sgn.sel .sgl,.sg-svg.has-sel .sgn.nb .sgl{display:block}
.sg-svg.has-sel .sge:not(.hi-out):not(.hi-in){opacity:.12}
.sg-svg.has-sel .sgn:not(.sel):not(.nb){opacity:.32}
.sg-svg .sge.hi-out{color:#6D4AE0}
.sg-svg .sge.hi-in{color:#1B9C8E}
.sg-svg .sge.hi-out.hi-in{color:#6D4AE0}
.sg-svg[data-f="aislados"] .sgn:not(.iso){opacity:.28}
.sg-svg[data-f="aislados"] .sge:not(.from-iso){opacity:.08}
.sg-svg[data-f="aislados"] .sge.from-iso{color:#D2412F}
.sg-svg[data-f="lideres"] .sgn:not(.lead){opacity:.3}
.sg-svg[data-f="lideres"] .sge:not(.to-lead){opacity:.08}
.sg-svg[data-f="parejas"] .sge:not(.mu){opacity:.05}
.sg-svg[data-f="parejas"] .sge.mu{color:#6D4AE0}
.sg-leg{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--text2)}
.sg-leg span{display:inline-flex;gap:7px;align-items:center}
.sg-leg svg{flex:none}
.sg-side{display:flex;flex-direction:column;gap:16px;min-width:0}
.sg-det .sd-top{display:flex;gap:12px;align-items:center}
.sg-det .sd-av{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font:800 18px var(--f-body);background:#E8E4FA;color:var(--navy);flex:none}
.sg-det .sd-av.iso{background:#FFE7E1;color:#9E2A1F}
.sg-det .sd-av.lead{background:#6D4AE0;color:#fff}
.sg-det h3{font:800 20px var(--f-display);color:var(--navy)}
.sd-row{display:flex;flex-direction:column;gap:6px}
.sd-k{font:800 11px var(--f-body);letter-spacing:.13em;text-transform:uppercase;color:#8A8CA6}
.sd-chips{display:flex;gap:6px;flex-wrap:wrap}
.sd-chips span,.sd-chips button{font:700 13.5px var(--f-body);border-radius:999px;padding:4px 11px;background:#F1EEFC;color:var(--navy);border:0}
.sd-chips button:hover{background:#E4DEFA}
.sd-chips .none{background:#FFF1EE;color:#9E2A1F}
.sd-do{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:10px 12px;background:#F3FBF8;color:#155A49;font-size:14px}
.sd-do > span:first-child{font-size:18px;line-height:1.2}
.sd-warn{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:10px 12px;background:#FFF5F3;color:#8A2A1D;font-size:14px}
.sd-warn > span:first-child{font-size:18px;line-height:1.2}
.sg-ask{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
.phone{width:210px;border-radius:30px;background:#1C1A2B;padding:10px;box-shadow:0 20px 34px -22px rgba(28,26,43,.9)}
.phone > div{border-radius:22px;background:linear-gradient(180deg,#F3EEFF,#FFFFFF);padding:14px 12px;display:flex;flex-direction:column;gap:10px}
.phone b{font:800 14.5px/1.3 var(--f-body);color:var(--navy);text-align:center}
.phone .ph-s{font-size:11.5px;color:var(--muted);text-align:center}
.phone .ph-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.phone .ph-g span{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;font:700 10.5px var(--f-body);color:var(--text2)}
.phone .ph-g i{width:40px;height:40px;border-radius:50%;overflow:hidden;background:#E3DAFF;display:block;line-height:0}
.phone .ph-g span.on i{box-shadow:0 0 0 3px #6D4AE0}
.phone .ph-g span.on::after{content:"✓";position:absolute;top:-4px;right:6px;width:18px;height:18px;border-radius:50%;background:#6D4AE0;color:#fff;font:900 11px/18px var(--f-body);text-align:center}
.phone .ph-b{border-radius:12px;background:#6D4AE0;color:#fff;font:800 13px var(--f-body);text-align:center;padding:8px}
.sg-how{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14.5px;color:var(--text2)}
.sg-how b{color:var(--navy)}
.fam-pj .fpj{display:flex;gap:14px;align-items:center}
.fam-pj .fpj > span{width:72px;flex:none;line-height:0}
.e-head .e-links{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}

@media (max-width:1180px){.pj-next{grid-template-columns:repeat(2,minmax(0,1fr))}.rmap-r{grid-template-columns:44px minmax(0,1.4fr) minmax(0,1fr) minmax(0,130px)}.rmap-r .rm-ev{display:none}}
@media (max-width:1100px){.stagebox.av-stage{position:relative}.pj-hero{grid-template-columns:minmax(0,1fr)}.pj-hero .pj-art{max-width:460px;justify-self:center}.pj-grid,.sg-grid,.corr{grid-template-columns:minmax(0,1fr)}.pj-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.evo-row{grid-template-columns:minmax(0,1fr)}.evo-ar{transform:rotate(90deg);height:22px}.team{grid-template-columns:minmax(0,1fr) auto;row-gap:10px}.tm-p{grid-column:1 / -1;order:3}.pj-badges{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){.pj-banner{grid-template-columns:minmax(0,1fr)}.pj-banner .pb-art{display:none}.pj-banner .pb-go{flex-direction:row;align-items:center;justify-content:space-between}.rmap-r{grid-template-columns:40px minmax(0,1fr) minmax(0,110px)}.rmap-r .rm-dim{display:none}.sg-ask{grid-template-columns:minmax(0,1fr)}.sg-ask .phone{justify-self:center}}
@media (max-width:640px){.pj-hero{padding:20px 18px 18px}.shop-main button{padding:6px 10px 6px 6px;font-size:15px}.shop-main .sm-ic{width:38px;height:38px}.pj-steps{grid-template-columns:minmax(0,1fr)}.pj-next{grid-template-columns:minmax(0,1fr)}.pj-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.corr-t{grid-template-columns:minmax(96px,1.2fr) repeat(3,minmax(0,1fr))}.corr-t .rh span{display:none}.pj-ficha{grid-template-columns:minmax(0,1fr) auto}.pj-ficha .pf-art{display:none}.pj-sign .ps-legs{gap:90px}}
@media (prefers-reduced-motion:reduce){.duo > .duo-lumi{animation:none}.evo-flash.go{animation:none}.evo-stage .ev-l{transition:none}.pj-medal{animation:none}}

/* ---------- v11: más limpio. Tu día como lista corta, Análisis por pestañas, menos cajas y menos texto ---------- */
body:not(.school) .side-tip{display:none}
.welcome{padding:10px 14px;gap:12px;border-radius:18px}
.wl-owl{width:44px}
.wl-owl svg{width:44px;height:44px}
.wl-t b{font-size:16px}
.wl-t span{font-size:13.5px}

/* page tabs: one subject at a time */
.ptabs{display:flex;gap:2px;border-bottom:1px solid #E3E1F2;overflow-x:auto;scrollbar-width:none}
.ptabs::-webkit-scrollbar{display:none}
.ptabs button{position:relative;flex:none;display:inline-flex;align-items:center;gap:7px;border:0;background:none;padding:10px 14px 12px;font:800 15px var(--f-body);color:#71738F;white-space:nowrap;border-radius:10px 10px 0 0;transition:color .2s,background .2s}
.ptabs button:hover{color:var(--navy);background:rgba(109,74,224,.05)}
.ptabs button[aria-selected="true"]{color:var(--navy)}
.ptabs button[aria-selected="true"]::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:3px;border-radius:3px;background:var(--accent)}
.tabpanel{display:flex;flex-direction:column;gap:18px;min-width:0}
.tabpanel[data-swapped] > *{animation:rise .35s cubic-bezier(.2,.7,.2,1) both}
.tabpanel[data-swapped] > *:nth-child(2){animation-delay:.05s}.tabpanel[data-swapped] > *:nth-child(3){animation-delay:.1s}
.an-ins{display:flex;gap:10px;align-items:flex-start;background:#EFEBFC;border-radius:16px;padding:12px 16px;font-size:15.5px;line-height:1.45;color:#3F4366}
.an-ins > span:first-child{font-size:18px;line-height:1.2;flex:none}
.an-ins b{color:var(--navy)}
.an-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.an-foot .small{flex:1 1 240px}

/* Tu día */
.hoy2-hero{position:relative;overflow:hidden;border-radius:26px;padding:24px 28px;display:flex;align-items:center;justify-content:space-between;gap:18px 24px;flex-wrap:wrap;color:#fff;background:linear-gradient(120deg,#1D2381 0%,#2F2A95 55%,#4A2FA3 100%);box-shadow:0 20px 40px -30px rgba(26,35,126,.9)}
.hoy2-hero::before{content:"";position:absolute;right:-70px;top:-120px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(171,71,188,.38),rgba(171,71,188,0) 70%)}
.hoy2-hero > *{position:relative;min-width:0}
.hoy2-hero .eyebrow{color:#FFD98A}
.hoy2-hero h1{font:800 clamp(26px,3vw,34px)/1.1 var(--f-display);margin-top:4px;letter-spacing:-.01em}
.hoy2-hero p{color:rgba(255,255,255,.84);font-size:15.5px;margin-top:6px;max-width:56ch}
.hoy2-hero p b{color:#fff}
.hh2-sem{display:flex;gap:4px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:6px}
.hh2-sem > div{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 14px;min-width:88px}
.hh2-sem i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c)}
.hh2-sem b{font:800 26px/1 var(--f-display);color:#fff}
.hh2-sem span{font-size:12px;font-weight:700;color:rgba(255,255,255,.74);white-space:nowrap}
.hoy2-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:18px;align-items:start}
.todo-list{display:flex;flex-direction:column}
.todo-r{border-top:1px solid #EFEEF8}
.todo-r:first-child{border-top:0}
.todo-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 0}
.todo-av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font:800 14px var(--f-body);color:var(--navy);background:#F4F2FC;box-shadow:inset 0 0 0 2.5px var(--lc)}
.todo-t{display:flex;align-items:center;gap:10px;min-width:0;border:0;background:none;padding:2px 0;text-align:left;color:inherit;font:inherit;border-radius:10px}
.todo-tx{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.todo-tx b{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:800 16px var(--f-body);color:var(--navy)}
.todo-lv{font:800 11.5px var(--f-body);padding:2px 9px;border-radius:999px}
.todo-do{font-size:14.5px;color:#4D5175;line-height:1.4}
.todo-chev{flex:none;display:grid;color:#A3A5BD;transition:transform .2s}
.todo-t:hover .todo-chev{color:var(--navy)}
.todo-r.open .todo-chev{transform:rotate(90deg)}
.todo-done{border:0;background:#F1EEFC;color:var(--navy);font-weight:800}
.todo-done:hover{background:#E6E0FB}
.todo-b{display:none;flex-direction:column;gap:10px;padding:0 0 16px 54px}
.todo-r.open .todo-b{display:flex}
.todo-b p{font-size:14.5px;line-height:1.5;color:#4D5175}
.todo-b p b{color:var(--navy)}
.todo-say{display:flex;gap:8px;align-items:flex-start;background:#F7F6FD;border-radius:12px;padding:9px 12px}
.todo-say svg{flex:none;margin-top:3px;color:var(--meta)}
.todo-acts{display:flex;gap:8px;flex-wrap:wrap}
.todo-more{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:6px 8px;margin:-6px 0 -4px -8px;border-radius:10px;font:800 14.5px var(--f-body);color:var(--accent-ink)}
.todo-more:hover{background:var(--accent-soft)}
.cls2{gap:12px}
.cls2-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}

      const chunk = RM ? text.length : 6; ci = Math.min(text.length, ci + chunk); el.textContent = text.slice(0, ci);
      $('.caret', out)?.remove(); el.insertAdjacentHTML('beforeend', '<span class="caret"></span>');
      if (ci >= text.length) { bi++; ci = 0; }
    };
    timer = setInterval(step, 16);
  });

};

function typeDoc(out, doc, done) {

function earlyChart(el) {

    const X = i => pl + (W - pl - pr) * i / (n - 1), Y = v => pt + (H - pt - pb) * (1 - (v - 40) / 60);
    const path = arr => arr.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join('');
    let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="El bienestar de Valeria baja desde la semana 6 y su lectura desde la semana 8">`;

    [40, 60, 80, 100].forEach(t => { s += `<line x1="${pl}" x2="${W - pr + 8}" y1="${Y(t)}" y2="${Y(t)}" stroke="${t === 40 ? '#D9D7EA' : '#EEEDF6'}"/><text x="${pl - 8}" y="${Y(t) + 4}" text-anchor="end">${t}</text>`; });
    L.forEach((l, i) => { s += `<text x="${X(i)}" y="${H - 8}" text-anchor="middle">${sm ? l.replace('Sem ', 'S') : l}</text>`; });
    s += `<path class="draw" d="${path(A)}" fill="none" stroke="${CA}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
    s += `<path class="fadein" d="${path(B)}" fill="none" stroke="${CB}" stroke-width="3" stroke-dasharray="8 6" stroke-linecap="round" stroke-linejoin="round"/>`;
    s += `<circle class="fadein" cx="${X(5)}" cy="${Y(A[5])}" r="7" fill="${CA}" stroke="#fff" stroke-width="3" style="animation-delay:.9s"/><text class="et-lab fadein" x="${X(5) - 12}" y="${Y(A[5]) + 24}" text-anchor="end" style="animation-delay:.9s">${sm ? 'Aviso' : 'Aviso a la maestra'}</text>`;

    [[A, CA, 'Bienestar ', ''], [B, CB, 'Lectura ', '%']].forEach(([arr, c, lb, u]) => { s += `<circle class="fadein" cx="${X(n - 1)}" cy="${Y(arr[n - 1])}" r="5" fill="${c}" stroke="#fff" stroke-width="2" style="animation-delay:1.2s"/><text class="et-end fadein" x="${X(n - 1) + 12}" y="${Y(arr[n - 1]) + 4}" style="animation-delay:1.2s">${sm ? '' : lb}${arr[n - 1]}${u}</text>`; });
    s += `<line class="xh" x1="0" x2="0" y1="${pt - 8}" y2="${H - pb}" stroke="#8A8CA6" stroke-width="1" opacity="0"/>`;
    s += `<circle class="hd" r="6" fill="${CA}" stroke="#fff" stroke-width="2.5" opacity="0"/><circle class="hd" r="6" fill="${CB}" stroke="#fff" stroke-width="2.5" opacity="0"/>`;

let copT = null;
function copType(out, doc, done) {
  clearInterval(copT);

  copT = setInterval(() => {

    if (bi >= doc.length) { clearInterval(copT); const c = $('.caret', out); if (c) c.remove(); if (done) done(); return; }
    const [tag, text] = doc[bi];
    if (ci === 0) { if (bi === 0) out.innerHTML = ''; if (tag === 'li') { if (!ul) { ul = document.createElement('ul'); out.appendChild(ul); } el = document.createElement('li'); ul.appendChild(el); } else { ul = null; el = document.createElement(tag); out.appendChild(el); } }

    const c = $('.caret', out); if (c) c.remove(); el.insertAdjacentHTML('beforeend', '<span class="caret"></span>');
    if (ci >= text.length) { bi++; ci = 0; }
  }, 16);

}
function copScroll(out) {
